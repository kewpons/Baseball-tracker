// Listeners sit on the canvas itself (touch-action:none there only) so the side gutters stay scrollable.
function initScanCropCanvas(){
  const canvas = document.getElementById('scanCropCanvas'); if(!canvas) return;

  ['mousedown','touchstart'].forEach(ev=>canvas.addEventListener(ev, scanCropDragStart, {passive:false}));
  ['mousemove','touchmove'].forEach(ev=>canvas.addEventListener(ev, scanCropDragMove, {passive:false}));
  ['mouseup','touchend','touchcancel','mouseleave'].forEach(ev=>canvas.addEventListener(ev, scanCropDragEnd));

function scanCropRotate90(dir){

  const img = new Image();
  img.onload = ()=>{ s.rawImage = img; s.cropRect = scanCropFullRectFor(img); s.tiltDeg = 0; s.detected = null; render(); };

}
function scanCropReset(){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;

function scanCropCancel(){ state.sheet = null; render(); }
// ---------------- ROSTER SCAN: detection + OCR pipeline ----------------
// Both scans use a full-resolution copy (tilt + crop mapped back from the on-screen canvas), always binarized; results go to the paste textarea.
//   scanRunDirect: crop -> binarize -> one OCR read (printed lists/tables)
//   scanRunRows:   detect cards -> group into rows -> OCR number (digits) and name (letters) -> "<num> <name>" lines
// Tesseract.js v5 recognize() ignores a 4th params arg: one persistent worker + setParameters().
let ocrWorker = null;
async function getOcrWorker(){

}
const OCR_WL_BOTH = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789'- ";
const OCR_WL_NUM = "0123456789";
const OCR_WL_NAME = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'- ";
const OCR_PSM = '6', OCR_THRESH = 99, OCR_UPSCALE_MIN_SIDE = 150, OCR_DIRECT_MAX_SIDE = 2400;
const ocrTick = ()=> new Promise(r=>setTimeout(r,20));
function ocrStatus(msg){ const el = document.querySelector('.sheet .loading-text'); if(el) el.textContent = msg; }

function scanCropTiltedCanvas(){

  const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); // tilt corners must be white, not transparent-black

}
function scanCropWorkCanvas(){
  const full = scanCropTiltedCanvas(), r = state.sheet.cropRect, k = scanCropDisplayScale();
  if(!r || r.w<4 || r.h<4){ full.ox = 0; full.oy = 0; return full; }
  const x0 = Math.max(0, Math.round(r.x/k)), y0 = Math.max(0, Math.round(r.y/k));
  const w = Math.max(1, Math.min(full.width-x0, Math.round(r.w/k))), h = Math.max(1, Math.min(full.height-y0, Math.round(r.h/k)));

// Tap-to-pick: averages a 9x9 patch of the full-res tilted image (the display canvas carries the crop tint).
function scanCropPickColorAt(p){

function scanColorAuto(){ const s=state.sheet; if(!s) return; s.pickedColors=[]; s.pickMode=false; render(); }
function scanColorPick(){ const s=state.sheet; if(!s) return; s.pickMode=true; render(); }
function scanColorRemove(i){ const s=state.sheet; if(!s) return; s.pickedColors.splice(i,1); render(); }

// ---- binarization: zero-padding crop -> Bradley adaptive threshold -> border/line removal -> despeckle ----
// floorFrac>0 adds a contrast floor (suppresses faint table lines); 0 = plain Bradley (colored cards).
function ocrThreshold(c, tFrac, floorFrac){
  tFrac = tFrac===undefined ? 0.15 : tFrac; floorFrac = floorFrac||0;
  const ctx = c.getContext('2d'), w = c.width, h = c.height; if(w<3||h<3) return c;
  const im = ctx.getImageData(0,0,w,h), d = im.data, g = new Float64Array(w*h);
  for(let i=0;i<w*h;i++) g[i] = 0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2];
  const I = new Float64Array((w+1)*(h+1));

  const s2 = Math.max(7, Math.floor(Math.min(w,h)/8));
  const hist = new Uint32Array(256); for(let i=0;i<w*h;i++) hist[g[i]|0]++;
  const pct = q=>{ let a=0; const t=q*w*h; for(let v=0;v<256;v++){ a+=hist[v]; if(a>=t) return v; } return 255; };
  const floor = floorFrac*Math.max(0, pct(0.95)-pct(0.005));
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const cx1=Math.max(0,x-s2), cx2=Math.min(w-1,x+s2), cy1=Math.max(0,y-s2), cy2=Math.min(h-1,y+s2);
    const cnt = (cx2-cx1+1)*(cy2-cy1+1);
    const sum = I[(cy2+1)*(w+1)+(cx2+1)]-I[cy1*(w+1)+(cx2+1)]-I[(cy2+1)*(w+1)+cx1]+I[cy1*(w+1)+cx1];
    const idx = y*w+x, v = (g[idx]*cnt<=sum*(1-tFrac) && sum/cnt-g[idx]>=floor) ? 0 : 255;

function ocrBandErase(c){

// Shared 4-connected blob labeler: cb(x0,y0,x1,y1,count,qx,qy) per blob in `mask` (qx/qy valid only during the callback).
function ocrBlobs(mask, w, h, cb){

    while(hd<tl){

      if(cx<x0)x0=cx; if(cx>x1)x1=cx; if(cy<y0)y0=cy; if(cy>y1)y1=cy;
      for(const [nx,ny] of [[cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]]){

// Erases speckle and thin straight border lines (a blob spanning >=85% of the crop but only a few px thick; real glyphs have more cross-extent).

// ---- card detection: ONE pass, generic color distance, no aspect filter ----
function ocrDist(r,g,b,ref){ const a=r-ref[0], b2=g-ref[1], c=b-ref[2]; return Math.sqrt(a*a+b2*b2+c*c); }
function ocrSampleBg(d,w,h){
  let R=0,G=0,B=0,n=0; const m=Math.max(2,Math.floor(Math.min(w,h)*0.03));

// Auto: flags pixels far from the edge background; picked colors: flags pixels near any picked color. Returns src-pixel blobs.
function ocrDetectBoxes(src, picked, thresh){

  const c = document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(src,0,0,w,h);
  const d = x.getImageData(0,0,w,h).data;

  const mask = new Uint8Array(w*h);

    if(manual){ let m=0; for(const p of picked){ if(ocrDist(r,g,b,p)<thresh){ m=1; break; } } mask[i]=m; }
    else mask[i] = ocrDist(r,g,b,bg)>thresh ? 1 : 0;
  }
  const boxes=[];

    const bw=x1-x0+1, bh=y1-y0+1, ratio=Math.max(bw,bh)/Math.max(1,Math.min(bw,bh));

// Cluster blobs into rows by vertical-center proximity.
function ocrGroupRows(boxes){
  const bs = boxes.map(b=>({...b, w:b.x1-b.x0, h:b.y1-b.y0, cy:(b.y0+b.y1)/2})).sort((a,b)=>a.cy-b.cy);
  const rs = [];
  bs.forEach(b=>{
    const r = rs[rs.length-1];
    if(r && Math.abs(b.cy-r.cy) < 0.5*Math.max(b.h,r.h)){
      r.items.push(b); r.cy = r.items.reduce((a,v)=>a+v.cy,0)/r.items.length; r.h = r.items.reduce((a,v)=>a+v.h,0)/r.items.length;
    } else rs.push({items:[b], cy:b.cy, h:b.h});

}
// Per row: squarest blob = number, widest = name. A lone blob is a number if its aspect ratio < 1.5.
function ocrClassify(rs){
  return rs.map(r=>{
    const it = r.items.map(b=>({...b, ar:b.w/b.h}));
    let num=null, name=null;
    if(it.length===1){ if(it[0].ar<1.5) num=it[0]; else name=it[0]; }
    else { const s=it.slice().sort((a,b)=>a.ar-b.ar); num=s[0]; name=s[s.length-1]; }
    return { num, name, numText:'', nameText:'', numConf:null, nameConf:null };

  state.pasteDraftText = s.scanResult.text; state.pastePanelOpen = true; state.pastePreviewShown = true;
  if(s.scanResult.jerseyFirst) state.importFirstNumberMeaning = 'jersey'; // number tiles = jersey numbers; row order = batting order
  state.sheet = null; render();
  setTimeout(()=>{ const el = document.getElementById('pastePanel'); if(el) el.scrollIntoView({behavior:'smooth', block:'center'}); }, 50);
}
async function scanRunDirect(){
  const prev = state.sheet; if(!prev || prev.outcome!=='SCAN_CROP') return;
  prev.detected = null;
  let src = scanCropWorkCanvas();
  state.sheet = { outcome:'SCAN_LOADING' }; render(); await ocrTick();
  try{
    const big = Math.max(src.width, src.height);
    if(big > OCR_DIRECT_MAX_SIDE){
      const k = OCR_DIRECT_MAX_SIDE/big, c = document.createElement('canvas');
      c.width = Math.round(src.width*k); c.height = Math.round(src.height*k); c.getContext('2d').drawImage(src,0,0,c.width,c.height); src = c;
    }
    const url = ocrCropBox(src, {x0:0,y0:0,x1:src.width,y1:src.height}, {band:false, minPx:4, floor:0.3});
    const w = await getOcrWorker();
    await w.setParameters({ tessedit_pageseg_mode:OCR_PSM, tessedit_char_whitelist:OCR_WL_BOTH });
    ocrStatus(t('scan_reading')); await ocrTick();
    const { data } = await w.recognize(url);
    const text = (data.text||'').trim();
    ocrShowResult(prev, text, text ? '' : t('scan_no_text'), false);
  }catch(e){ console.error(e); ocrFail(prev); }
}
async function scanRunRows(){
  const prev = state.sheet; if(!prev || prev.outcome!=='SCAN_CROP') return;
  const src = scanCropWorkCanvas(), picked = (prev.pickedColors||[]).slice();
  state.sheet = { outcome:'SCAN_LOADING' }; render(); await ocrTick();
  try{
    ocrStatus(t('scan_detecting')); await ocrTick();
    const rows = ocrClassify(ocrGroupRows(ocrDetectBoxes(src, picked, OCR_THRESH)));
    const ox = src.ox||0, oy = src.oy||0, shift = b=> b ? { x0:b.x0+ox, y0:b.y0+oy, x1:b.x1+ox, y1:b.y1+oy } : null;
    prev.detected = rows.map(r=>({ num:shift(r.num), name:shift(r.name) }));
    if(!rows.length){ ocrShowResult(prev, '', t('scan_no_rows'), true); return; }
    const numJobs=[], nameJobs=[];
    rows.forEach(r=>{
      if(r.num) numJobs.push({ url: ocrCropBox(src, r.num), set:(tx,cf)=>{ r.numText = tx.replace(/\D/g,''); r.numConf = cf; } });
      if(r.name) nameJobs.push({ url: ocrCropBox(src, r.name), set:(tx,cf)=>{ r.nameText = tx; r.nameConf = cf; } });
    });
    const w = await getOcrWorker();
    const pass = async (jobs, label, wl)=>{
      await w.setParameters({ tessedit_pageseg_mode:OCR_PSM, tessedit_char_whitelist:wl });
      for(let i=0;i<jobs.length;i++){
        ocrStatus(`${label} ${i+1}/${jobs.length}…`); await ocrTick();
        const { data } = await w.recognize(jobs[i].url);
        jobs[i].set(data.text.trim().replace(/\s+/g,' '), data.confidence);
      }
    };
    await pass(numJobs, t('scan_numbers'), OCR_WL_NUM);
    await pass(nameJobs, t('scan_names'), OCR_WL_NAME);
    const text = rows.map(r=>[r.numText.trim(), r.nameText.trim()].filter(Boolean).join(' ')).filter(Boolean).join('\n');
    const low = rows.filter(r=>(r.numConf!=null&&r.numConf<60)||(r.nameConf!=null&&r.nameConf<60)).length;
    const note = text ? `${rows.length} ${t('scan_note_rows')}${low?` · ${low} ${t('scan_note_low')}`:''}` : t('scan_no_text');
    ocrShowResult(prev, text, note, true);
  }catch(e){ console.error(e); ocrFail(prev); }
}
function openSubSheet(key, lineupIndex){ state.sheet = { outcome:'SUB_PLAYER', teamKey:key, lineupIndex }; render(); }
function confirmSub(newId){
  const s = state.sheet; if(!s) return;
  const key = s.teamKey, idx = s.lineupIndex;
  pushHistory();
  const tm = team(key);
  const outId = tm.lineup[idx];
  tm.lineup[idx] = newId;
  ensureStats(key, newId);
  // Record each side's inning for the "/ in Xth" / "/ out Xth" labels; later events overwrite.
  if(!tm.subHistory) tm.subHistory = {};
  tm.subHistory[newId] = Object.assign({}, tm.subHistory[newId], { inInning: state.inning });
  if(outId) tm.subHistory[outId] = Object.assign({}, tm.subHistory[outId], { outInning: state.inning });
  if(battingKey()===key && tm.battingIdx===idx) state.count = {balls:0, strikes:0, fouls:0};
  state.sheet = null;
  render();
}

function renderScorebookGrid(){

  const tm = team(key);
  const ids = battingRosterIds(key);
  const curKey = battingKey();
  const curBatter = state.gameOver? null : currentBatterId();
  const maxInnSeen = Math.max(state.inning, 1);

  // One column per "time through" per inning (extra columns only when the lineup looped). Columns key off the entry's
  // subIndex (shared slot loop count, see nextSlotSubIndex) so a mid-loop sub lands in the right column;
  // older saves lack subIndex and fall back to array position.
  const entrySubIndex = (b, idx)=> (b.subIndex!==undefined ? b.subIndex : idx);
  const columns = [];
  for(let inn=1; inn<=maxInnSeen; inn++){
    let maxSub = 0;
    ids.forEach(pid=>{ getBoxes(key,pid,inn).forEach((b,idx)=>{ const si=entrySubIndex(b,idx); if(si>maxSub) maxSub=si; }); });
    for(let j=0;j<=maxSub;j++){
      columns.push({ inning: inn, subIndex: j, label: inn + (j>0 ? "'".repeat(j) : '') });
    }
  }
  // Ensure the batter now up always has a column.
  if(!state.gameOver && key===curKey && curBatter){
    const curSub = currentSlotSubIndex(key);
    if(!columns.some(c=>c.inning===state.inning && c.subIndex===curSub)){
      columns.push({ inning: state.inning, subIndex: curSub, label: state.inning + (curSub>0 ? "'".repeat(curSub) : '') });
    }
  }
  columns.sort((a,b)=> a.inning-b.inning || a.subIndex-b.subIndex);

  const rows = ids.map(pid=>({ pid, isCurrent: !state.gameOver && key===curKey && pid===curBatter, subbedOut: tm.lineup.length>0 && !tm.lineup.includes(pid) }));

  return `

    <button class="${state.scorebookTeam==='us'?'active':''}" onclick="state.scorebookTeam='us';render()">${team('us').name}</button>
    <button class="${state.scorebookTeam==='them'?'active':''}" onclick="state.scorebookTeam='them';render()">${team('them').name}</button>
  </div>
  <div class="zoom-bar grid-print-hide">
    <button onclick="zoomScorebook(-1)">−</button>
    <div class="pct">${ZOOM_STEPS[state.scorebookZoom]}%</div>
    <button onclick="zoomScorebook(1)">+</button>
  </div>
  <div class="caption" style="margin-bottom:6px;">${t('sb_tap_hint')}</div>
  <div class="card" id="scorebookPrintArea" style="width:100%;">
    <div style="font-weight:800; font-size:13px; margin-bottom:8px;">${tm.name} — ${t('hdr_batting')}</div>
    <div class="grid-scroll">
      <div class="grid-inner" style="transform:scale(${ZOOM_STEPS[state.scorebookZoom]/100});">
      <table class="scorebook">
        <thead><tr><th class="name-col">Batter</th>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map(r=>{
            const pid = r.pid;
            const cells = columns.map(c=>{
              const boxes = getBoxes(key, pid, c.inning);
              const entry = boxes.find((b,idx)=>entrySubIndex(b,idx)===c.subIndex);
              if(entry){
                return `<td class="box-cell filled" onclick="openBoxDetail('${key}','${pid}',${c.inning})">${renderBoxPreview(entry, false)}</td>`;
              } else if(r.isCurrent && c.inning===state.inning && c.subIndex===currentSlotSubIndex(key)){
                return `<td class="box-cell current" onclick="setScreen('game')">${renderBoxPreview(null, true)}</td>`;
              } else {

            const subNote = subNoteText(key, pid);
            return `<tr>${r.subbedOut?'<td class="name-cell" style="opacity:0.55;">':'<td class="name-cell">'}${orderNameJersey(key,pid)}${subNote?` <span style="font-size:10px;color:#8C8570;">${subNote}</span>`:''}</td>${cells}</tr>`;
          }).join('') || `<tr><td colspan="${columns.length+1}" class="empty-note">No batters yet</td></tr>`}

function diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum){
  const seg = (idx)=> (legTags && legTags[idx] && idx<=reached) ? '#D8D2C2' : (idx<=reached ? '#2D6A4F' : '#D8D2C2');
  const scored = reached>=4;
  const label = code && code.length>7 ? code.slice(0,7) : (code||'');
  const segCoords = {1:[30,52,52,30], 2:[52,30,30,8], 3:[30,8,8,30], 4:[8,30,30,52]};
  // Leg labels sit outside each leg's normal: top legs (2, 3) pulled down, bottom legs (1, 4) up, clear of the batter circle.
  const labelPos = {1:[47.4,43], 2:[47.4,20], 3:[12.6,20], 4:[12.6,43]};
  // Batter-number circles sit further out so they don't collide with leg labels.
  const batterLabelPos = {1:[52.5,52.5], 2:[52.5,7.5], 3:[7.5,7.5], 4:[7.5,52.5]};
  const dotAttr = 'stroke-dasharray="2.5 2.5" stroke-linecap="butt"';
  const legText = (pos,txt,fill)=>`<text x="${pos[0]}" y="${pos[1]}" font-size="6.5" font-weight="800" fill="${fill}" stroke="#F7F4EC" stroke-width="2.2" paint-order="stroke" text-anchor="middle" font-family="ui-monospace,monospace">${txt}</text>`;
  const batterCircle = (pos,n)=>`<circle cx="${pos[0]}" cy="${pos[1]}" r="6" fill="#F7F4EC" stroke="#2D6A4F" stroke-width="1.2"></circle>
          <text x="${pos[0]}" y="${pos[1]+2.8}" font-size="8" font-weight="800" fill="#2D6A4F" text-anchor="middle" font-family="ui-monospace,monospace">${n}</text>`;

  // Per-leg tags (SB/WP/PB, FC, batterNum) persist per leg, so an SB on leg 2 survives a later advance to leg 3.
  let legOverlays = '';
  if(legTags){
    Object.keys(legTags).forEach(legNumStr=>{
      const legNum = Number(legNumStr);
      if(legNum<1 || legNum>reached) return;
      const {label: tagLabel, dotted, batterNum} = legTags[legNum];
      const [x1,y1,x2,y2] = segCoords[legNum];
      // The solid leg is skipped (see seg()), so this overlay is the only line; dotted shows clearly on the plain background.
      legOverlays += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2D6A4F" stroke-width="${dotted?3:4}" ${dotted? dotAttr : 'stroke-linecap="square"'}></line>`;
      if(tagLabel) legOverlays += legText(labelPos[legNum], tagLabel, '#2D6A4F');
      if(batterNum) legOverlays += batterCircle(batterLabelPos[legNum], batterNum);
    });
  }

  // Out attempt: amber leg, dotted + CS/PO/WP/PB tag when applicable, plus the batter-number circle (green: it identifies
  // the batter). Drawn here because this leg is never in legTags.
  let attemptLine = '';
  if(attemptTo && attemptTo===reached+1 && attemptTo<=4){
    const [x1,y1,x2,y2] = segCoords[attemptTo];
    const mx = x1+(x2-x1)/2, my = y1+(y2-y1)/2;
    const isDotted = !!outAdvTag;
    attemptLine = `<line x1="${x1}" y1="${y1}" x2="${mx}" y2="${my}" stroke="#FFB800" stroke-width="4" stroke-linecap="round" ${isDotted?dotAttr:''}></line>`;
    if(isDotted) attemptLine += legText(labelPos[attemptTo], outAdvTag, '#8a6100');
    if(outBatterNum) attemptLine += batterCircle(batterLabelPos[attemptTo], outBatterNum);
  }
  return `
    ${scored? `<polygon points="30,52 52,30 30,8 8,30" fill="#FFB800" opacity="0.3"></polygon>`:''}
    <line x1="30" y1="52" x2="52" y2="30" stroke="${seg(1)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="52" y1="30" x2="30" y2="8"  stroke="${seg(2)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="30" y1="8"  x2="8"  y2="30" stroke="${seg(3)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="8"  y1="30" x2="30" y2="52" stroke="${seg(4)}" stroke-width="4" stroke-linecap="square"></line>
    ${legOverlays}
    ${attemptLine}
    ${lob
      ? `<text x="30" y="35" text-anchor="middle" font-size="11.3" font-weight="700" fill="#1C2621" font-family="Georgia,'Times New Roman',serif">&#8467;</text>`
      : (label? `<text x="30" y="33" text-anchor="middle" font-size="${(label==='K'||label==='Ks')?10:8.5}" font-weight="${(label==='K'||label==='Ks')?900:800}" fill="#1C2621" ${(label==='K'||label==='Ks')?'stroke="#1C2621" stroke-width="0.45" paint-order="stroke fill"':''} font-family="ui-monospace,monospace">${label}</text>`:'')}`;
}
function miniDiamond(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum){
  return `<svg width="45" height="45" viewBox="0 0 60 60" style="position:absolute; top:14px; left:50%; margin-left:-22.5px; width:45px; height:45px; display:block;">${diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum)}</svg>`;
}
function largeDiamond(reached, code, attemptTo, legTags, outAdvTag, size, lob, outBatterNum){
  size = size || 92;
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" style="display:block; margin:0 auto;">${diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum)}</svg>`;
}

function startEditBoxEntry(idx){
  if(!state.sheet) return;

  state.sheet.editIndex = idx;

function editEntryCount(field, delta){
  if(!state.sheet) return;
  const { teamKey, playerId, inning, editIndex } = state.sheet;
  const entry = getBoxes(teamKey, playerId, inning)[editIndex];
  if(!entry) return;

function tapEditFielder(n){ if(state.sheet){ state.sheet.editSeq.push(n); render(); } }
function undoEditFielder(){ if(state.sheet){ state.sheet.editSeq.pop(); render(); } }
function setEditPrefix(p){ if(state.sheet){ state.sheet.editPrefix = p; render(); } }
function toggleEditDP(){ if(state.sheet){ state.sheet.editDP = !state.sheet.editDP; render(); } }
function composeEditAnnotation(includeDP=true){
  const s = state.sheet;
  if(!s) return '';
  const seq = (s.editSeq||[]).join('-');
  let text;
  if(s.editPrefix==='none') text = seq;
  else if(s.editPrefix==='F') text = seq? 'F-'+seq : 'F';
  else if(s.editPrefix==='E') text = seq? 'E'+seq : 'E';
  else text = seq? `${s.editPrefix} ${seq}` : s.editPrefix;
  if(includeDP && s.editDP) text = text? text+' DP' : 'DP';
  return text;
}
function applyEditAnnotation(){
  if(!state.sheet) return;
  const { teamKey, playerId, inning, editIndex } = state.sheet;
  const entry = getBoxes(teamKey, playerId, inning)[editIndex];
  const composed = composeEditAnnotation(false); // DP excluded from centre label
  if(entry){
    if(composed) entry.outPlay = composed;
    entry.dp = !!state.sheet.editDP; // drives the .box-bl "DP" badge in the grid
  }
  state.sheet.editIndex = null;
  render();
}

// Flags runner-movement choices that would put two people on one base. Shared by the hit and OUT_PLAY sheets
// (same stay/advance/score/out choices).
function computeBaseAssignments(s){
  const bases = {1:[],2:[],3:[]};
  if(s.outcome==='HR') return bases; // every existing runner scores, batter scores — no base collisions possible
  (s.runners||[]).forEach(r=>{
    const nm = `#${r.num} ${r.name}`;
    if(r.choice==='stay') bases[r.base].push(nm);
    else if(r.choice==='advance1'){ const nb=r.base+1; if(nb<=3) bases[nb].push(nm); }
    else if(r.choice==='advance2'){ const nb=r.base+2; if(nb<=3) bases[nb].push(nm); }
  });
  let battb = null;
  if(s.outcome==='OUT_PLAY'){ if(!s.batter.out) battb = 1; }
  else { const dest = batterDestBase(s.kind || s.outcome); if(typeof dest==='number') battb = dest; }
  if(battb) bases[battb].push('Batter');
  return bases;
}
function baseCollisionMessages(s){
  const bases = computeBaseAssignments(s);
  const labels = {1:'1st',2:'2nd',3:'3rd'};
  const msgs = [];
  [1,2,3].forEach(b=>{ if(bases[b].length>1) msgs.push(`${bases[b].join(' & ')} would both be on ${labels[b]}`); });
  return msgs;
}

function previewBasesForSheet(s){
  const key = battingKey();
  const bases = {1:null,2:null,3:null};
  const scored = [];
  if(s.outcome==='HR'){
    (s.runners||[]).forEach(r=>scored.push(r));
  } else {
    (s.runners||[]).slice().sort((a,b)=>b.base-a.base).forEach(r=>{
      if(r.choice==='stay') bases[r.base]=r;
      else if(r.choice==='advance1'){ const nb=r.base+1; if(nb<=3) bases[nb]=r; else scored.push(r); }
      else if(r.choice==='advance2'){ const nb=r.base+2; if(nb<=3) bases[nb]=r; else scored.push(r); }
      else if(r.choice==='score') scored.push(r);
    });
  }
  const dest = batterDestBase(s.kind || s.outcome);
  const batter = { id: currentBatterId(), name: playerName(key, currentBatterId()), num: playerNum(key, currentBatterId()) };
  if(s.outcome==='OUT_PLAY'){
    if(!s.batter.out) bases[1]=batter; // safe batter ends at 1st
  } else if(dest==='home') scored.push(batter); else if(dest) bases[dest]=batter;
  return {bases, scored};
}
// Shared by every fielder-picking sheet: field art plus a circle+number marker per position. Tapped fielders (seq) go amber
// with order badges and chain lines. bases/runnerLabels come only from the movement sheets; the others show an empty field.
function fielderFieldHTML(seq, bases, runnerLabels){
  bases = bases || {};
  const fs = fieldFielderFontSize(FIELD_RENDER_W_SM);
  const markers = Object.keys(FIELD_FIELDERS).map(n=>{
    const f = FIELD_FIELDERS[n];
    const idx = seq.indexOf(Number(n));
    const on = idx>=0;
    return `<circle cx="${f.x}" cy="${f.y}" r="${fs*(on?1.0:0.8)}" fill="${on?'#FFB800':'rgba(255,255,255,0.75)'}" stroke="${on?'#8a6100':'#8C8570'}" stroke-width="${fs*0.09}"></circle>
      <text x="${f.x}" y="${f.y+fs*0.34}" text-anchor="middle" font-size="${fs}" font-weight="800" fill="${on?'#1C2621':'#5B5648'}" font-family="ui-monospace,monospace">${n}</text>
      ${on && seq.length>1 ? `<text x="${f.x+fs*1.05}" y="${f.y-fs*0.7}" text-anchor="middle" font-size="${fs*0.85}" font-weight="900" fill="#5a4000" font-family="ui-monospace,monospace">${idx+1}</text>` : ''}`;
  }).join('');
  const chain = seq.slice(0,-1).map((n,i)=>{
    const p1 = FIELD_FIELDERS[n], p2 = FIELD_FIELDERS[seq[i+1]];
    return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#FFB800" stroke-width="${fs*0.12}" stroke-linecap="round" opacity="0.85"></line>`;
  }).join('');
  return `
  <div class="fld">
    <svg viewBox="${FIELD_VIEWBOX}">
      ${FIELD_BACKGROUND_SVG}
      ${fieldBaseRect(2, !!bases[2])}
      ${fieldBaseRect(1, !!bases[1])}
      ${fieldBaseRect(3, !!bases[3])}
      <g>${chain}${markers}</g>
      ${runnerLabels||''}
    </svg>
  </div>`;
}
const FIELDER_POS = ['P','C','1B','2B','3B','SS','LF','CF','RF'];
const LEGEND_HTML = `<div class="legend">${FIELDER_POS.map((p,i)=>`<span>${i+1} ${p}</span>`).join('')}</div>`;
function closeSheet(){ state.sheet = null; render(); }
// Standard sheet: header (title + optional context), body, pinned [Cancel | primary] bar. lock = backdrop tap doesn't dismiss
// (entry sheets). cancel = {label, fn}; primary = {label, fn, disabled}; tall = 96dvh (field sheets).
function sheetShell({title, ctx, body, primary, cancel, tall, lock}){
  cancel = cancel || {label:'Cancel', fn:'closeSheet()'};
  return `${lock ? '<div class="sheet-backdrop"></div>' : SHEET_BACKDROP}
  <div class="sheet has-bar${tall?' tall':''}">
    <div class="sh-head"><h3>${title}</h3>${ctx?`<span class="sh-ctx">${ctx}</span>`:''}</div>
    ${body}
    <div class="sheet-actions"><button class="btn ghost" onclick="${cancel.fn}">${cancel.label}</button>${primary?`<button class="btn" ${primary.disabled?'disabled':''} onclick="${primary.fn}">${primary.label}</button>`:''}</div>
  </div>`;
}
// o: {sel, out (orange), adv (green outline), disabled, cls}
function chip(label, fn, o){
  o = o||{};
  return `<button class="chip${o.sel?' sel':''}${o.out?' out':''}${o.adv?' adv':''}${o.cls?' '+o.cls:''}"${o.disabled?' disabled':''} onclick="${fn}">${label}</button>`;
}
// kind: 'out' (orange), 'ok' (green), 'warn'
function bannerHTML(kind, html){ return `<div class="banner ${kind}">${html}</div>`; }
// Field (left) + banner, notes and legend (right): the top block of every field sheet.
function fieldBlock(seq, bases, runnerLabels, banner, notes){
  return `<div class="field-block">${fielderFieldHTML(seq, bases, runnerLabels)}<div class="fb-side">${banner}${notes||''}${LEGEND_HTML}</div></div>`;
}
// Field block for the runner-movement sheets (hit confirm / out play): base preview, scoring and active-fielder notes.
function movementField(s, banner, extraNote){
  const {bases, scored} = previewBasesForSheet(s);
  const key = battingKey();
  const seq = activeSeqFor(s);
  const runnerFs = fieldFielderFontSize(FIELD_RENDER_W_SM) * 1.15; // runner-jersey tag: 15% larger than the fielder digits
  const runnerLabels = [1,2,3].map(n=>{
    const r = bases[n]; if(!r) return '';
    const p = fieldLabelPos(n);
    return `<text x="${p.x}" y="${p.y}" font-family="ui-monospace,monospace" font-size="${runnerFs}" font-weight="900" fill="#FFB800" stroke="#8a6100" stroke-width="${runnerFs*0.11}" paint-order="stroke fill" text-anchor="middle">${battingOrderNum(key, r.id)||''}</text>`;
  }).join('');
  const notes = (scored.length ? `<div class="fb-note score">Scoring: ${scored.map(r=>orderNameJersey(key,r.id)).join(', ')}</div>` : '')
    + (extraNote ? `<div class="fb-note">${extraNote}</div>` : '')
    + (seq.length ? `<div class="fb-note">fielders for: <b style="color:var(--field-2);">${s.activeSubject==='batter'?'Batter':'runner on '+({1:'1st',2:'2nd',3:'3rd'}[s.activeSubject])}</b></div>` : '')
    + (s.outOrder && s.outOrder.length>=2 ? `<div class="fb-note">Tap <span class="x-badge">×</span> to swap out order</div>` : '');
  return fieldBlock(seq, bases, runnerLabels, banner, notes);
}
// Row of 1-9 tap buttons. fnPrefix = onclick call up to the position number, e.g. 'tapEditFielder(' or 'sheetOutFieldTap(2,'.
function fielderBtnRow(fnPrefix){
  return `<div class="chips">${FIELDER_POS.map((p,i)=>`<button class="chip num" title="${p}" onclick="${fnPrefix}${i+1})">${i+1}</button>`).join('')}</div>`;
}
function undoChip(fn, label){ return `<button class="chip undo" onclick="${fn}">↺ ${label||'Undo'}</button>`; }
// "Fielders  6-4 [↺ Undo] [extra]" label line above a fielderBtnRow; extra = e.g. the DP toggle.
function fielderLine(label, seq, undoFn, extra){
  return `<div class="ln" style="margin:2px 0 4px;"><span class="lbl" style="width:auto;">${label}</span><span style="display:flex;align-items:center;gap:6px;"><span class="seq">${seq.join('-')}</span>${undoChip(undoFn)}${extra||''}</span></div>`;
}
// "Out at" chip row: opts = [[value,label],...].
function outAtRow(opts, selected, fnPrefix){
  return `<div class="ln"><span class="lbl">Out at</span><div class="chips" style="flex:1;">${opts.map(([v,l])=>chip(l, `${fnPrefix}${v})`, {out:true, sel:selected===v})).join('')}</div></div>`;
}
// Runner row shared by the OUT_PLAY and hit-confirm sheets. showDpToggle: OUT_PLAY derives DP from outOrder,
// so only the hit sheet needs the manual toggle.
function renderRunnerRow(r, s, showDpToggle){
  const b = r.base, idx = s.outOrder.indexOf(b), ord = battingOrderNum(battingKey(),r.id);
  const badge = idx>=0 ? `<div class="out-badge ${s.swapSelect===b?'sel':''}" onclick="outPlayTapBadge(${b})">${idx+1}</div>` : '';
  const ch = (label, choice)=> chip(label, `sheetChoose(${b},'${choice}')`, {sel:r.choice===choice});
  return `
  <div class="runner-row">
    <div class="rname ln"><span>${ord?ord+'. ':''}${r.name} (on ${b===1?'1st':b===2?'2nd':'3rd'})</span>${badge}</div>
    <div class="chips">${ch('Stays','stay')}${ch('+1 base','advance1')}${ch('+2 bases','advance2')}${ch('Scores','score')}${chip('Out', `sheetChoose(${b},'out')`, {out:true, sel:r.choice==='out'})}</div>
    ${r.choice==='out' ? `
    <div style="margin-top:5px;">${outAtRow(outTargetOptions(b).map(o=>[o.v,o.label]), r.outTarget, `sheetChoose(${b},'out',`)}</div>
    ${fielderLine('Fielders', r.outFieldSeq||[], `sheetOutFieldUndo(${b})`, showDpToggle ? chip('DP', `sheetToggleRunnerPrefix(${b},'DP')`, {out:true, sel:r.outPrefix==='DP', cls:'sq'}) : '')}
    ${fielderBtnRow(`sheetOutFieldTap(${b},`)}` : ''}
  </div>`;
}
function renderSheet(){
  const s = state.sheet;
  if(!s) return '';
  if(s.outcome==='SCAN_CROP'){
    const picked = s.pickedColors||[];
    const activeStyle = 'border-color:var(--field-2);background:#F0F7F3;';
    const res = s.scanResult;
    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet tall">
      <h3>${t('scan_crop_title')}</h3>
      <div class="sub" style="font-size:11px;color:#8C8570;margin-bottom:10px;">${t('scan_crop_hint')}</div>
      <div id="scanCropWrap" style="position:relative; display:flex; justify-content:center;">
        <canvas id="scanCropCanvas" style="touch-action:none; max-width:100%; max-height:42vh; width:auto; height:auto; border-radius:8px; border:1.5px solid var(--line);"></canvas>
      </div>
      ${(s.detected && s.detected.length) ? `<div style="text-align:center;font-size:10.5px;color:#8C8570;margin-top:4px;">${t('scan_legend')}</div>` : ''}
      <label style="margin-top:10px;">${t('lbl_fine_tilt')}: <span id="scanTiltVal">${s.tiltDeg||0}</span>°</label>
      <input type="range" min="-45" max="45" step="1" value="${s.tiltDeg||0}" style="width:100%;margin-bottom:6px;" oninput="scanCropTiltChange(this.value)">
      <div class="row" style="justify-content:center; gap:6px;">
        <button class="btn ghost small" style="flex:none;padding:7px 10px;" onclick="scanCropRotate90(-1)">⟲ ${t('btn_rotate_left')}</button>
        <button class="btn ghost small" style="flex:none;padding:7px 10px;" onclick="scanCropReset()">${t('btn_reset_crop')}</button>
        <button class="btn ghost small" style="flex:none;padding:7px 10px;" onclick="scanCropRotate90(1)">⟳ ${t('btn_rotate_right')}</button>
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-top:14px;">
        <div style="flex:0 0 34%; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#8C8570; line-height:1.25;">${t('lbl_card_color')}</div>
        <div class="row" style="flex:1;">
          <button class="btn ghost small" style="${!picked.length&&!s.pickMode?activeStyle:''}" onclick="scanColorAuto()">${t('btn_color_auto')}</button>
          <button class="btn ghost small" style="${s.pickMode?activeStyle:''}" onclick="scanColorPick()">${t('btn_color_pick')}</button>
        </div>
      </div>
      ${picked.length ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 0;">${picked.map((c,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:14px;padding:3px 8px;font-size:11px;"><i style="width:14px;height:14px;border-radius:4px;border:1px solid #0003;display:inline-block;background:rgb(${c});"></i>rgb(${c})<a onclick="scanColorRemove(${i})" style="color:var(--clay);padding:0 2px;">✕</a></span>`).join('')}</div>` : ''}
      ${s.pickMode ? `<div class="sub" style="font-size:11px;color:var(--clay);font-weight:700;margin-top:6px;">${t('scan_pick_hint')}</div>` : ''}
      <div class="row" style="margin-top:10px;">
        <button class="btn" onclick="scanRunDirect()">${t('btn_ocr_direct')}</button>
        <button class="btn" onclick="scanRunRows()">${t('btn_ocr_rows')}</button>
      </div>
      ${res ? `
      <div id="scanResult" style="margin-top:14px;border-top:1px dashed var(--line);padding-top:10px;">
        <label>${t('scan_result_title')}</label>
        ${res.note ? `<div style="font-size:11.5px;font-weight:700;margin-bottom:6px;color:${res.text?'#8C8570':'var(--clay)'};">${escapeHtml(res.note)}</div>` : ''}
        ${res.text ? `<div style="white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12.5px;background:#FAF8F2;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:160px;overflow-y:auto;">${escapeHtml(res.text)}</div>` : ''}
      </div>` : ''}
      <div class="row" style="margin-top:14px;">
        <button class="btn ghost" onclick="scanCropCancel()">${t('btn_scan_retake')}</button>
        <button class="btn" ${res&&res.text?'':'disabled'} onclick="scanResultOk()">${t('btn_ok')}</button>
      </div>
    </div>`;
  }
  if(s.outcome==='SCAN_LOADING'){
    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <h3>${t('scan_loading_title')}</h3>
      <div class="sub">${t('scan_loading_sub')}</div>
      <div class="spinner"></div>
      <div class="loading-text">${t('scan_loading_note')}</div>
    </div>`;
  }
  if(s.outcome==='STRIKEOUT_TYPE'){
    return sheetShell({ title:'Strikeout — looking or swinging?',
      body:`<div class="chips">${chip('Looking (K)', "chooseStrikeoutType('K')", {out:true})}${chip('Swinging (Ks)', "chooseStrikeoutType('Ks')", {out:true})}</div>` });
  }
  if(s.outcome==='BOX_DETAIL'){
    const boxes = getBoxes(s.teamKey, s.playerId, s.inning);
    const who = `#${playerNum(s.teamKey,s.playerId)} ${playerName(s.teamKey,s.playerId)}`;
    const eb = (s.editIndex!==null && s.editIndex!==undefined) ? boxes[s.editIndex] : null;
    if(eb){
      const pre = (label,p)=> chip(label, `setEditPrefix('${p}')`, {sel:s.editPrefix===p});
      const cnt = (lbl,f)=> `<span class="cnt-grp"><span class="lbl" style="width:auto;">${lbl}</span>${chip('−', `editEntryCount('${f}',-1)`, {cls:'sq'})}<b>${eb[f]}</b>${chip('+', `editEntryCount('${f}',1)`, {cls:'sq'})}</span>`;
      return sheetShell({ title:`${who} · Inn ${s.inning} · PA ${s.editIndex+1}`, ctx:'Editing', tall:true,
        body:`<div class="cnt">${cnt('B','balls')}${cnt('S','strikes')}</div>
          ${fieldBlock(s.editSeq||[], null, '', bannerHTML('ok', `Annotation:<br><b>${composeEditAnnotation()||'—'}</b>`), undoChip('undoEditFielder()', 'Undo fielder'))}
          <div class="chips" style="margin-bottom:3px;">${pre('Plain','none')}${pre('Fly','F')}${pre('FC','FC')}${pre('E','E')}${pre('SF','SF')}</div>
          <div class="chips" style="margin-bottom:8px;">${pre('SH','SH')}${pre('CS','CS')}${pre('PO','PO')}${chip('+DP', 'toggleEditDP()', {sel:s.editDP})}<span style="flex:1;"></span></div>
          ${fielderBtnRow('tapEditFielder(')}
          <div class="sh-sub" style="margin-top:8px;">Edits count and annotation only, not score, outs, or stats. Use Undo on Live for those.</div>`,
        primary:{label:'Apply', fn:'applyEditAnnotation()'}, cancel:{label:'Cancel', fn:'cancelEditBoxEntry()'} });
    }
    const baseLabel = (r)=> ['out','1st','2nd','3rd','scored'][r] || '—';
    return sheetShell({ title:`${who} — Inning ${s.inning}`, cancel:{label:'Close', fn:'closeSheet()'},
      body:`${boxes.map((b,i)=>{
        const centerLabel = b.outPlay || b.code || '';
        return `
        <div class="sb-detail-row" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;">
            <div style="flex:none;">${largeDiamond(b.reached, centerLabel, b.outAttemptTo, b.legTags, b.outAdvTag, 96, b.lob, b.outBatterNum)}</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                <div style="font-weight:700;">Plate appearance ${i+1}: ${b.code}${b.outPlay && b.outPlay!==b.code? ` → ${b.outPlay}`:''}${b.dp? ' · DP':''}</div>
                <button class="btn small ghost" onclick="startEditBoxEntry(${i})">Edit</button>
              </div>
              <div style="font-size:12px; color:#8C8570;">
                Reached: ${baseLabel(b.reached)}${b.isOut? ` · Out #${b.outNumber}`:''} · count ${b.balls}-${b.strikes}${b.fouls? ` · ${b.fouls} foul${b.fouls>1?'s':''}`:''}
              </div>
            </div>
          </div>
        </div>`;
      }).join('') || '<div class="empty-note">No plate appearances recorded.</div>'}
      <div class="sh-sub" style="margin-top:8px;">Editing here only fixes the pitch count and annotation — it doesn't change the score, outs, or stats. For that, use Undo on the Live tab and re-enter the play.</div>` });
  }
  if(s.outcome==='RUNNER_EVENT'){
    const r = s.runners[0];
    const rl = orderNameJersey(battingKey(), r.id);
    if(s.mode==='choose_wp_pb'){
      const adv = s.pendingAction==='advance';
      return sheetShell({ title:`${rl} — ${adv?'Advances':'Thrown out advancing'}`, cancel:{label:'← Back', fn:'backToRunnerMain()'},
        body:`<div class="sh-sub">Was it a wild pitch or a passed ball?</div>
          <div class="chips">${chip('Wild Pitch', "selectWpPbType('WP')", {adv, out:!adv})}${chip('Passed Ball', "selectWpPbType('PB')", {adv, out:!adv})}</div>` });
    }
    if(s.mode==='out_entry'){
      const reasonLabel = s.outReason==='OOB' ? `Thrown Out Advancing (${s.wpType})` : {CS:'Caught Stealing', PO:'Picked Off'}[s.outReason];
      const seq = s.fieldSeq||[];
      return sheetShell({ title:`${rl} — ${reasonLabel}`, tall:true, lock:true,
        cancel:{label:'← Back', fn:'backToRunnerMain()'}, primary:{label:'Confirm out', fn:'confirmRunnerOut()'},
        body:`<div class="sh-sub">Tap the fielders involved, in order (optional).</div>
          ${fieldBlock(seq, null, '', bannerHTML('out', `Fielders:<br><b>${seq.join('-')||'—'}</b>`), undoChip('undoRunnerOutFielder()', 'Undo fielder'))}
          ${fielderBtnRow('tapRunnerOutFielder(')}` });
    }
    const blocked = stealAdvanceBlocked(s.baseTapped);
    return sheetShell({ title:`Runner: ${rl}`, ctx:`on ${{1:'1st',2:'2nd',3:'3rd'}[s.baseTapped]}`,
      body:`${blocked ? `<div style="margin-bottom:8px;">${bannerHTML('warn','Next base occupied — only outs possible')}</div>` : ''}
        <div class="pick-cols">
          <div class="pick-col"><div class="pick-head" style="color:var(--field-2);">Advance</div>
            ${chip('Steals next base', "runnerAdvance('steal')", {adv:true, disabled:blocked})}
            ${chip('Advances (WP/PB)', "chooseWpPb('advance')", {adv:true, disabled:blocked})}</div>
          <div class="pick-col"><div class="pick-head" style="color:var(--clay);">Out</div>
            ${chip('Caught stealing', "startRunnerOutEntry('CS')", {out:true})}
            ${chip('Out advancing (WP/PB)', "chooseWpPb('out')", {out:true})}
            ${chip('Picked off', "startRunnerOutEntry('PO')", {out:true})}</div>
        </div>` });
  }
  if(s.outcome==='OUT_PLAY'){
    const finalKind = deriveOutPlayKind(s);
    const batterIdx = s.outOrder.indexOf('batter');
    const batterBadge = batterIdx>=0 ? `<div class="out-badge ${s.swapSelect==='batter'?'sel':''}" onclick="outPlayTapBadge('batter')">${batterIdx+1}</div>` : '';
    const collisions = baseCollisionMessages(s);
    const canConfirm = (s.outOrder.length>0 || s.kind==='E') && !collisions.length;
    const banner = canConfirm
      ? bannerHTML(s.outOrder.length?'out':'ok', `Recorded as:<br><b>${OUTCOME_LABELS[finalKind]||finalKind}</b>`)
      : bannerHTML('warn', collisions.length ? `${collisions.join('; ')} — fix before confirming.` : 'Mark at least one out, or cancel and use a hit/error button.');
    const batterSection = `
      <div class="runner-row">
        <div class="rname ln"><span>Batter <span class="pill ${s.batter.out?'out':'safe'}" style="margin-left:6px;">${s.batter.out?'Out':'Safe'}</span></span>${batterBadge}</div>
        ${s.batter.out ? outAtRow([[1,'1st'],[2,'2nd'],[3,'3rd'],[4,'Home']], s.batter.outAt||1, 'outPlaySetBatterOutAt(') : ''}
        ${(s.batter.out || s.kind==='E') ? fielderLine(s.kind==='E' ? 'Error charged to' : 'Fielders', s.batter.seq, 'outPlayUndoBatterFielder()') + fielderBtnRow('outPlayTapBatterFielder(') : ''}
      </div>`;
    return sheetShell({ title:OUTCOME_LABELS[s.kind]||s.kind, tall:true, lock:true,
      body:`${movementField(s, banner)}${batterSection}${s.runners.map(r=>renderRunnerRow(r, s, false)).join('')}`,
      primary:{label:'Confirm play', fn:'confirmOutPlay()', disabled:!canConfirm} });
  }
  if(s.outcome==='SUB_PLAYER'){
    const tm = team(s.teamKey);
    const outId = tm.lineup[s.lineupIndex];
    const bench = tm.players.filter(p=>!tm.lineup.includes(p.id));
    return sheetShell({ title:`Substitute for ${orderNameJersey(s.teamKey,outId)}`,
      body: bench.length ? bench.map(p=>`
        <div class="lineup-pick" onclick="confirmSub('${p.id}')">
          <span>${p.num.trim()!==''?'#'+p.num+' ':''}${p.name||'(no name)'}</span>
        </div>`).join('') : '<div class="empty-note">No eligible bench players — add one on the Roster tab first.</div>' });
  }
  if(s.outcome==='CHANGE_BATTER'){
    const t = team(s.teamKey);
    return sheetShell({ title:`Set current batter — ${t.name}`,
      body:t.lineup.map((id,i)=>`
        <div class="lineup-pick ${i===t.battingIdx?'cur':''}" onclick="setBatter('${id}')">
          <span>${orderNameJersey(s.teamKey,id)}</span>
          ${i===t.battingIdx?'<span class="pill">At bat</span>':''}
        </div>`).join('') });
  }
  if(s.outcome==='SWITCH_PITCHER'){
    const tm = team(s.teamKey);
    return sheetShell({ title:`Set current pitcher — ${tm.name}`,
      body:tm.lineup.map(id=>`
        <div class="lineup-pick ${id===tm.currentPitcherId?'cur':''}" onclick="confirmSwitchPitcher('${id}')">
          <span>${orderNameJersey(s.teamKey,id)}</span>
          ${id===tm.currentPitcherId?'<span class="pill">Pitching</span>':''}
        </div>`).join('') });
  }
  // Hit confirm (1B/2B/3B) with runners on
  const label = OUTCOME_LABELS[s.outcome];
  const willBeFC = ['1B','2B','3B'].includes(s.outcome) && s.runners.some(r=>r.choice==='out');
  const collisions = baseCollisionMessages(s);
  const banner = collisions.length ? bannerHTML('warn', `${collisions.join('; ')} — fix before confirming.`)
    : willBeFC ? bannerHTML('out', `Recorded as:<br><b>Fielder's Choice</b>`) : bannerHTML('ok', `Recorded as:<br><b>${label}</b>`);
  return sheetShell({ title:label, tall:true, lock:true,
    body:`${movementField(s, banner, willBeFC ? 'no hit credited' : '')}${s.runners.map(r=>renderRunnerRow(r, s, true)).join('')}`,
    primary:{label:'Confirm play', fn:'confirmSheet()', disabled:collisions.length>0} });
}

restoreAutosaveIfAny();
render();
</script>
</body>
</html>
