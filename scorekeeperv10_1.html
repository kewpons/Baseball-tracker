// ---------------- ROSTER PHOTO SCAN (Tesseract.js OCR, client-side only) ----------------
// Parses raw OCR text into candidate {num, name, flagged} rows. Each non-blank line is checked
// for a leading number token (allowing #, ., ), or - separators) followed by a name. A line with
// no leading number still comes through as a name-only row (flagged, so the user fills in the
// number) rather than being silently dropped — OCR frequently loses a faint jersey number even
// when the name reads fine. `flagged` marks anything worth a second look: a non-purely-numeric
// number token (common misread, e.g. "l3" for "13"), or a missing number.
function triggerScan(){ syncPasteDraft(); document.getElementById('scanCameraInput').click(); }
function triggerFromImage(){ syncPasteDraft(); document.getElementById('scanLibraryInput').click(); }

// Detects HEIC/HEIF (common default on iPhone camera) and converts to JPEG client-side via
// heic2any before anything else touches the file — canvas/Tesseract can't decode HEIC directly
// on most browsers (only Safari has native support), so without this step iPhone photos would
// silently fail everywhere else.
function handleScanFile(input){
  const file = input.files[0];
  const teamKey = state.setupTeam;
  input.value = ''; // allow re-selecting the same file next time
  if(!file) return;
  const isHeic = /\.hei[cf]$/i.test(file.name) || /heic|heif/i.test(file.type);
  const proceedWithBlob = (blob)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        state.sheet = {
          outcome:'SCAN_CROP', teamKey,
          originalImage: img, rawImage: img,
          tiltDeg: 0, cropRect: null, dragStart: null
        };
        render();
      };
      img.onerror = ()=>{ alert(t('scan_fail')); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(blob);
  };
  if(isHeic){
    if(typeof heic2any === 'undefined'){ alert(t('scan_fail')); return; }
    heic2any({ blob:file, toType:'image/jpeg', quality:0.92 }).then(proceedWithBlob).catch(()=>{ alert(t('scan_fail')); });
  } else {
    proceedWithBlob(file);
  }
}

// ---- Crop/rotate sheet (SCAN_CROP): direct canvas manipulation, not routed through the app's
// full render() during drags/rotation — re-rendering the whole app on every pointermove would
// destroy/recreate the canvas element mid-drag. Only entering/leaving the sheet, and discrete
// rotate/crop/reset actions, go through render(); dragging and the tilt slider redraw the canvas
// directly (same pattern the roster's oninput fields already use for high-frequency updates). ----
function scanCropDisplayScale(){
  const s = state.sheet;
  const maxW = Math.min(360, window.innerWidth - 60);
  return Math.min(1, maxW / s.rawImage.width);
}
function drawScanCropCanvas(){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  const canvas = document.getElementById('scanCropCanvas'); if(!canvas) return;
  const scale = scanCropDisplayScale();
  canvas.width = s.rawImage.width * scale;
  canvas.height = s.rawImage.height * scale;
  const ctx = canvas.getContext('2d');
  const tilt = (s.tiltDeg||0) * Math.PI/180;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2, canvas.height/2);
  ctx.rotate(tilt);
  ctx.drawImage(s.rawImage, -canvas.width/2, -canvas.height/2, canvas.width, canvas.height);
  ctx.restore();
  if(s.cropRect){
    ctx.strokeStyle = '#FFB800'; ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.strokeRect(s.cropRect.x, s.cropRect.y, s.cropRect.w, s.cropRect.h);
    ctx.fillStyle = 'rgba(255,184,0,0.12)';
    ctx.fillRect(s.cropRect.x, s.cropRect.y, s.cropRect.w, s.cropRect.h);
  }
}
function scanCropCanvasPoint(e){
  const canvas = document.getElementById('scanCropCanvas');
  const rect = canvas.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const cy = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  return { x: cx * canvas.width/rect.width, y: cy * canvas.height/rect.height };
}
function scanCropDragStart(e){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  e.preventDefault();
  s.dragStart = scanCropCanvasPoint(e);
  s.cropRect = { x:s.dragStart.x, y:s.dragStart.y, w:0, h:0 };
}
function scanCropDragMove(e){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP' || !s.dragStart) return;
  e.preventDefault();
  const p = scanCropCanvasPoint(e);
  s.cropRect = {
    x: Math.min(s.dragStart.x, p.x), y: Math.min(s.dragStart.y, p.y),
    w: Math.abs(p.x-s.dragStart.x), h: Math.abs(p.y-s.dragStart.y)
  };
  drawScanCropCanvas();
}
function scanCropDragEnd(){ const s = state.sheet; if(s) s.dragStart = null; }
function scanCropTiltChange(val){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  s.tiltDeg = Number(val);
  const lbl = document.getElementById('scanTiltVal'); if(lbl) lbl.textContent = val;
  drawScanCropCanvas();
}
function initScanCropCanvas(){
  const wrap = document.getElementById('scanCropWrap'); if(!wrap) return;
  drawScanCropCanvas();
  ['mousedown','touchstart'].forEach(ev=>wrap.addEventListener(ev, scanCropDragStart, {passive:false}));
  ['mousemove','touchmove'].forEach(ev=>wrap.addEventListener(ev, scanCropDragMove, {passive:false}));
  ['mouseup','touchend','mouseleave'].forEach(ev=>wrap.addEventListener(ev, scanCropDragEnd));
}
function scanCropRotate90(dir){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  const w = s.rawImage.width, h = s.rawImage.height;
  const c = document.createElement('canvas');
  c.width = h; c.height = w;
  const ctx = c.getContext('2d');
  ctx.translate(c.width/2, c.height/2);
  ctx.rotate(dir * Math.PI/2);
  ctx.drawImage(s.rawImage, -w/2, -h/2);
  const img = new Image();
  img.onload = ()=>{ s.rawImage = img; s.cropRect = null; s.tiltDeg = 0; render(); };
  img.src = c.toDataURL('image/png');
}
function scanCropApplyCrop(){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP' || !s.cropRect || s.cropRect.w<4 || s.cropRect.h<4) return;
  const canvas = document.getElementById('scanCropCanvas'); // already has current tilt baked in
  const out = document.createElement('canvas');
  out.width = s.cropRect.w; out.height = s.cropRect.h;
  out.getContext('2d').drawImage(canvas, s.cropRect.x, s.cropRect.y, s.cropRect.w, s.cropRect.h, 0, 0, s.cropRect.w, s.cropRect.h);
  const img = new Image();
  img.onload = ()=>{ s.rawImage = img; s.cropRect = null; s.tiltDeg = 0; render(); };
  img.src = out.toDataURL('image/png');
}
function scanCropReset(){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  s.rawImage = s.originalImage; s.cropRect = null; s.tiltDeg = 0;
  render();
}
function scanCropCancel(){ state.sheet = null; render(); }
// Continue straight to OCR on the current working image (with tilt baked in even if the user
// never drew a crop box) — lets a well-framed photo skip cropping entirely.
function scanCropConfirm(){
  const s = state.sheet; if(!s || s.outcome!=='SCAN_CROP') return;
  const canvas = document.getElementById('scanCropCanvas'); // current tilt already baked in
  const teamKey = s.teamKey;
  runOCRAndReview(canvas.toDataURL('image/png'), teamKey);
}

// Fixed preprocessing (grayscale + contrast boost + 2x upscale) and PSM 6 (uniform block of
// text) — settings validated against real roster photos in a standalone test harness before
// being hard-coded here; not exposed as user-facing controls in the real app.
function preprocessForOCR(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = 2;
      const c = document.createElement('canvas');
      c.width = img.width*scale; c.height = img.height*scale;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const imgData = ctx.getImageData(0,0,c.width,c.height);
      const d = imgData.data;
      const contrastFactor = 1.6, intercept = 128*(1-contrastFactor);
      for(let i=0;i<d.length;i+=4){
        const v = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        const cv = Math.max(0,Math.min(255, v*contrastFactor+intercept));
        d[i]=d[i+1]=d[i+2]=cv;
      }
      ctx.putImageData(imgData,0,0);
      resolve(c.toDataURL('image/png'));
    };
    img.src = dataUrl;
  });
}
// OCR text is dropped into the shared paste textarea/panel — same toggle, same Preview/Add flow as
// manual paste — rather than its own structured review UI, so all three import sources (paste, image,
// scan) go through one review surface.
function runOCRAndReview(dataUrl, teamKey){
  state.sheet = { outcome:'SCAN_LOADING' };
  render();
  if(typeof Tesseract === 'undefined'){ state.sheet = null; render(); alert(t('scan_fail')); return; }
  preprocessForOCR(dataUrl).then(processedUrl=>{
    return Tesseract.recognize(processedUrl, 'eng', {}, { tessedit_pageseg_mode: '6' });
  }).then(({data:{text}})=>{
    state.sheet = null;
    state.setupTeam = teamKey;
    state.pasteDraftText = (text||'').trim();
    state.pastePanelOpen = true;
    render();
  }).catch(()=>{
    state.sheet = null; render();
    alert(t('scan_fail'));
  });
}
function addToLineup(key, id){
  pushHistory();
  ensureStats(key,id);
  const t = team(key);
  if(!t.lineup.includes(id)) t.lineup.push(id);
  render();
}
function openSubSheet(key, lineupIndex){ state.sheet = { outcome:'SUB_PLAYER', teamKey:key, lineupIndex }; render(); }
function confirmSub(newId){
  const s = state.sheet; if(!s) return;
  const key = s.teamKey, idx = s.lineupIndex;
  pushHistory();
  const tm = team(key);
  const outId = tm.lineup[idx];
  tm.lineup[idx] = newId;
  ensureStats(key, newId);
  // Record which inning each side of the sub happened in, for the "/ in Xth" / "/ out Xth" labels
  // in Box Score and Scorebook. A player could theoretically be subbed in and later subbed out again
  // (or re-subbed in a second time) — each event just overwrites with the latest inning it happened.
  if(!tm.subHistory) tm.subHistory = {};
  tm.subHistory[newId] = Object.assign({}, tm.subHistory[newId], { inInning: state.inning });
  if(outId) tm.subHistory[outId] = Object.assign({}, tm.subHistory[outId], { outInning: state.inning });
  if(battingKey()===key && tm.battingIdx===idx) state.count = {balls:0, strikes:0, fouls:0};
  state.sheet = null;
  render();
}

function fieldBaseRect(n, isOccupied, onclickAttr){
  const cx = FIELD_BASE[n].x, cy = FIELD_BASE[n].y;
  const s = isOccupied ? 53.725*2 : 53.725; // doubles in size when occupied, per approved mockup
  const half = s/2;
  const fill = isOccupied ? '#FFB800' : '#F7F5EF';
  const stroke = isOccupied ? '#8a6100' : '#D7D1C5';
  const clickPart = onclickAttr ? ` style="cursor:pointer;" onclick="${onclickAttr}"` : '';
  return `<rect x="${cx-half}" y="${cy-half}" width="${s}" height="${s}" transform="rotate(45 ${cx} ${cy})" fill="${fill}" stroke="${stroke}" stroke-width="3" filter="url(#baseShadow)"${clickPart}></rect>`;
}

// Live-tab diamond: uses the approved V10 field art crop (viewBox extended to "920 740 1300 1370",
// content wrapped in the asset's own translate(0,55) group). Includes the dirt fan, the grass-stripe
// clip group, mound, rubber, and home plate — all verbatim from that asset. The 3 static white base
// squares from the V10 file are intentionally omitted here since fieldBaseRect() (dynamic: white idle /
// yellow+enlarged when occupied) replaces them, drawn in a second identically-transformed group layered
// on top. viewBox top extended (830→740, height 1280→1370) beyond the raw V10 crop so the runner-jersey
// label above 2nd base has room and doesn't clip against the top edge.
// Original crop, unchanged — confirmed correctly sized. Pills that would otherwise overrun the left/
// right edge (1st/3rd base) are allowed to spill outside this viewBox via the .diamond-inner svg's
// overflow:visible rather than by widening the viewBox itself, which only ever trades edge-clipping for
// a smaller diamond on width-constrained screens. These three are still coupled if ever changed:
// viewBox string, its width scalar, and the CSS render width in .diamond-inner.
const FIELD_VIEWBOX_COMPACT = "770 740 1592 1370";
const FIELD_VIEWBOX_W_COMPACT = 1592;
const FIELD_RENDER_W_COMPACT = 318; // matches .diamond-inner width
// Every pill (runner jersey, pitcher, pitch count) shares one flat 12px on-screen font size.
function fieldPillFontSize(){ return 12 * FIELD_VIEWBOX_W_COMPACT / FIELD_RENDER_W_COMPACT; }
// Longest name shown in full inside a pill before truncating with an ellipsis — keeps room for the
// jersey-number suffix on a long name without the pill growing unreasonably wide.
const PILL_MAX_NAME_CHARS = 11;
// Shared pill builder: "<order>. <name> #<jersey>" (order/jersey each optional) in one pill — bold order
// number, regular name, regular jersey suffix (no bold, per review). style 'amber' = runner (base-
// occupancy tint kept), 'neutral' = pitcher/pitch-count (white, matches the fielder-position markers).
function fieldPillColors(style){
  return style==='amber'
    ? { fill:'rgba(255,248,230,0.85)', stroke:'#8a6100', text:'#8a6100' }
    : { fill:'rgba(255,255,255,0.7)', stroke:'#8C8570', text:'#1C2621' };
}
function fieldPillMarkup(cx, cy, order, name, jerseyNum, style){
  const fs = fieldPillFontSize();
  const pillH = fs*1.35; // reduced internal vertical padding
  const orderPart = order? `${order}. ` : '';
  let displayName = name||'';
  if(displayName.length>PILL_MAX_NAME_CHARS) displayName = displayName.slice(0,PILL_MAX_NAME_CHARS-1)+'…';
  const jerseyPart = (jerseyNum && jerseyNum!=='-') ? ` #${jerseyNum}` : '';
  // Trailing +fs*2 term is ~1 character width of padding on each side of the text.
  const pillW = Math.max(fs*2.6, (orderPart.length+displayName.length+jerseyPart.length)*fs*0.56 + fs*2);
  const c = fieldPillColors(style);
  return `<rect x="${cx-pillW/2}" y="${cy-pillH/2}" width="${pillW}" height="${pillH}" rx="${pillH/2}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="${fs*0.09}"></rect>
    <text x="${cx}" y="${cy}" font-family="ui-monospace,monospace" text-anchor="middle" dominant-baseline="central"><tspan font-size="${fs}" font-weight="900" fill="${c.text}">${orderPart}</tspan><tspan font-size="${fs}" font-weight="500" fill="${c.text}">${displayName}</tspan><tspan font-size="${fs}" font-weight="500" fill="${c.text}">${jerseyPart}</tspan></text>`;
}
// Live-tab runner pill position: above each base, cleared far enough to sit above that base's ENLARGED
// (occupied) square — the pill is only ever shown while the base is occupied, so this clearance is
// always in play whenever the pill renders.
const FIELD_ENLARGED_BASE_HALF_DIAGONAL = 53.725*2*Math.SQRT1_2; // ~76 viewBox units
function fieldPillLabelPos(baseNum){
  const b = FIELD_BASE[baseNum];
  const pillH = fieldPillFontSize()*1.35;
  const offset = FIELD_ENLARGED_BASE_HALF_DIAGONAL + 8 + pillH/2;
  return {x:b.x, y:b.y-offset};
}
// Simple single-line pill (no order/name/jersey structure) — used for the pitch-count pill.
function fieldSimplePill(cx, cy, text, style){
  const fs = fieldPillFontSize();
  const pillH = fs*1.35;
  const pillW = Math.max(fs*2.6, text.length*fs*0.58 + fs*2);
  const c = fieldPillColors(style);
  return `<rect x="${cx-pillW/2}" y="${cy-pillH/2}" width="${pillW}" height="${pillH}" rx="${pillH/2}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="${fs*0.09}"></rect>
    <text x="${cx}" y="${cy}" font-family="ui-monospace,monospace" font-size="${fs}" font-weight="800" fill="${c.text}" text-anchor="middle" dominant-baseline="central">${text}</text>`;
}
// Fixed clearance (in viewBox units) kept between the rubber's edges and each pill.
const FIELD_PITCHER_LABEL_GAP = 10;
// Builds the pitch-count pill + batting-order/name/jersey pill for the mound. Returns '' when there's
// no pitcher to show (pitching not tracked, or no pitcher set yet) so callers can splice it in
// unconditionally.
function fieldPitcherLabel(){
  if(!state.trackPitching) return '';
  const fKey = fieldingKey();
  const id = team(fKey).currentPitcherId;
  if(!id) return '';
  const cx = FIELD_MOUND.x;
  const fs = fieldPillFontSize();
  const pillH = fs*1.35;
  // Rubber (drawn at pre-translate y=1369, height=24) spans mound.y-11.28 to mound.y+12.72.
  const rubberTop = FIELD_MOUND.y - 11.28;
  const rubberBottom = FIELD_MOUND.y + 12.72;
  const countCy = rubberTop - FIELD_PITCHER_LABEL_GAP - pillH/2;
  const pitchCount = (ensurePitch(fKey, id).pitches||0) + state.count.balls + state.count.strikes + (state.count.fouls||0);
  const countPill = fieldSimplePill(cx, countCy, 'PC: '+pitchCount, 'neutral');
  const pillCy = rubberBottom + FIELD_PITCHER_LABEL_GAP + pillH/2;
  const namePill = fieldPillMarkup(cx, pillCy, battingOrderNum(fKey,id), playerName(fKey,id), playerNum(fKey,id), 'neutral');
  // Invisible tap target sized to cover the mound circle plus both pills' own bounding boxes, so either
  // end stays fully tappable even when a long name pushes a pill wider or the mound's default radius
  // wouldn't otherwise reach a pill.
  const topY = countCy - pillH/2;
  const bottomY = pillCy + pillH/2;
  const tapHalfW = 110;
  const tapTop = Math.min(FIELD_MOUND.y - 94, topY);
  const tapBottom = Math.max(FIELD_MOUND.y + 94, bottomY);
  const tapTarget = `<rect x="${cx-tapHalfW}" y="${tapTop}" width="${tapHalfW*2}" height="${tapBottom-tapTop}" fill="transparent" pointer-events="all"></rect>`;
  // Everything wrapped in one clickable group: without this, a tap that lands on a visible pill (rather
  // than the gap between them) would hit that element instead of the invisible tap rect beneath it, and
  // register nothing — the exact "long name is hard to tap" symptom this fixes.
  return `<g style="cursor:pointer;" onclick="openPitcherSheet()">${countPill}${namePill}${tapTarget}</g>`;
}

function renderDiamond(){
  const key = battingKey();
  const b1 = state.bases[1], b2 = state.bases[2], b3 = state.bases[3];
  const runnerLabels = [1,2,3].map(n=>{
    const id = state.bases[n]; if(!id) return '';
    const p = fieldPillLabelPos(n);
    return fieldPillMarkup(p.x, p.y, battingOrderNum(key,id), playerName(key,id), playerNum(key,id), 'amber');
  }).join('');
  return `
  <div class="diamond-wrap compact">
    <div class="diamond-inner">
      <svg viewBox="${FIELD_VIEWBOX_COMPACT}">
        ${fieldInfieldBackgroundSVG()}
        <g transform="translate(0 55)">
          ${fieldPitcherLabel()}
          ${fieldBaseRect(2, !!b2, 'openRunnerSheet(2)')}
          ${fieldBaseRect(1, !!b1, 'openRunnerSheet(1)')}
          ${fieldBaseRect(3, !!b3, 'openRunnerSheet(3)')}
          ${runnerLabels}
        </g>
      </svg>
      <div class="corner-tag br">
        Outs
        <div class="outs">${[0,1,2].map(i=>`<div class="out-dot ${i<state.outs?'on':''}"></div>`).join('')}</div>
      </div>
    </div>
  </div>`;
}

function renderGame(){
  if(!state.gameStarted) return `<div class="empty-note">Set up both rosters first, then start the game.</div>`;
  if(state.gameOver){
    return `${renderGameOverBanner(true)}
      <div class="empty-note">See the Box Score tab for full stats.</div>`;
  }
  const key = battingKey();
  const bid = currentBatterId();
  return `
  ${renderDiamond()}
  <div class="caption">${t('live_tap_runner')}${state.trackPitching ? `<br>${t('live_tap_pitcher')}` : ''}</div>
  <div class="card merged-card">
    <div class="merged-top">
      <div class="batter-name">${orderNameJersey(key,bid)}</div>
      <div class="count-inline">
        <span class="cl">B</span><span class="cv">${state.count.balls}</span><span class="sep">-</span><span class="cv">${state.count.strikes}</span><span class="cl">S</span>
        ${state.count.fouls? `<span class="foul-badge">${state.count.fouls} foul${state.count.fouls>1?'s':''}</span>` : ''}
      </div>
    </div>
    <div class="merged-counts">
      <div class="cbtn-grp"><button class="btn small ghost" onclick="subBall()">B−</button><button class="btn small ghost" onclick="addBall()">B+</button></div>
      <div class="cbtn-grp"><button class="btn small ghost" onclick="subStrike()">S−</button><button class="btn small ghost" onclick="addStrike()">S+</button></div>
      <button class="btn small ghost" onclick="addFoul()">Foul</button>
      <button class="btn small ghost" style="margin-left:auto;" onclick="resetCount()">Reset</button>
    </div>
  </div>
  <div class="outcome-row">
    <div class="outcome-col">
      <div class="side-label">${t('grp_on_base_short')}</div>
      <div class="grid-btns-2">
        <button onclick="applyOutcome('1B')">1B</button>
        <button onclick="applyOutcome('2B')">2B</button>
        <button onclick="applyOutcome('3B')">3B</button>
        <button onclick="applyOutcome('HR')">HR</button>
        <button onclick="applyOutcome('BB')">BB</button>
        <button onclick="applyOutcome('HBP')">${t('out_hbp')}</button>
        <button style="grid-column:1/3;" onclick="applyOutcome('E')">${t('out_e')}</button>
      </div>
    </div>
    <div class="outcome-col">
      <div class="grid-btns-2 out-actions">
        <button onclick="applyOutcome('K')">${t('out_k')}</button>
        <button onclick="applyOutcome('GO')">${t('out_go')}</button>
        <button onclick="applyOutcome('FO')">${t('out_fo')}</button>
        <button onclick="applyOutcome('PU')">${t('out_pu')}</button>
        <button onclick="applyOutcome('SF')">${t('out_sf')}</button>
        <button onclick="applyOutcome('SAC')">${t('out_sac')}</button>
      </div>
      <div class="side-label out">${t('grp_out_short')}</div>
    </div>
  </div>
  ${state.trackPitching?`
  <div class="card" style="margin-top:10px;">
    <div style="font-size:13px; display:flex; justify-content:space-between; align-items:center;">
      <span>Pitching (${team(fieldingKey()).name}): <b>${orderNameJersey(fieldingKey(),team(fieldingKey()).currentPitcherId)}</b></span>
      <span class="mono" style="font-weight:800; color:var(--field-2);">${(ensurePitch(fieldingKey(),team(fieldingKey()).currentPitcherId).pitches||0) + state.count.balls + state.count.strikes + (state.count.fouls||0)} pitches</span>
    </div>
    <select onchange="switchPitcher('${fieldingKey()}', this.value)">
      ${team(fieldingKey()).lineup.map(id=>`<option value="${id}" ${id===team(fieldingKey()).currentPitcherId?'selected':''}>${orderNameJersey(fieldingKey(),id)}</option>`).join('')}
    </select>
  </div>`:''}
  <div class="log card" style="margin-top:10px;">${state.log.slice(0,8).map(l=>`<div>${l}</div>`).join('') || '<div class="empty-note">No plays yet</div>'}</div>
  `;
}

function renderBox(){
  function teamBlock(key){
    const tm = team(key);
    const ids = battingRosterIds(key);
    const totals = {AB:0,R:0,H:0,RBI:0,BB:0,SO:0};
    const body = ids.map(id=>{
      const st = ensureStats(key,id);
      const subbedOut = tm.lineup.length>0 && !tm.lineup.includes(id);
      const subNote = subNoteBox(key, id);
      totals.AB+=st.AB; totals.R+=st.R; totals.H+=st.H; totals.RBI+=st.RBI; totals.BB+=st.BB; totals.SO+=st.SO;
      return `<tr${subbedOut?' style="opacity:0.55;"':''}><td>${orderNameJersey(key,id)}${subNote?` <span style="font-size:10px;color:#8C8570;">${subNote}</span>`:''}</td><td>${st.AB}</td><td>${st.R}</td><td>${st.H}</td><td>${st.d2}</td><td>${st.d3}</td><td>${st.HR}</td><td>${st.RBI}</td><td>${st.BB}</td><td>${st.SO}</td><td>${st.SB}</td><td>${avg(st)}</td><td>${obp(st)}</td><td>${slg(st)}</td><td>${ops(st)}</td></tr>`;
    }).join('');
    const pitchRows = Object.keys(tm.pitchStats).map(id=>{
      const ps = tm.pitchStats[id];
      return `<tr><td>${orderNameJersey(key,id)}</td><td>${Math.floor(ps.outs/3)}.${ps.outs%3}</td><td>${ps.pitches||0}</td><td>${ps.H}</td><td>${ps.R}</td><td>${ps.ER}</td><td>${ps.BB}</td><td>${ps.K}</td></tr>`;
    }).join('');
    return `
    <h2 class="section-title">${tm.name} — ${t('hdr_batting')}</h2>
    <div class="card" style="overflow-x:auto;">
      <table class="box">
        <thead><tr><th>Player</th><th>AB</th><th>R</th><th>H</th><th>2B</th><th>3B</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>SB</th><th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th></tr></thead>
        <tbody>${body || `<tr><td colspan="15" class="empty-note">No stats yet</td></tr>`}</tbody>
        <tfoot><tr style="font-weight:700;"><td>Total</td><td>${totals.AB}</td><td>${totals.R}</td><td>${totals.H}</td><td></td><td></td><td></td><td>${totals.RBI}</td><td>${totals.BB}</td><td>${totals.SO}</td><td></td><td></td><td></td><td></td><td></td></tr></tfoot>
      </table>
    </div>
    ${state.trackPitching?`
    <h2 class="section-title">${tm.name} — ${t('hdr_pitching')}</h2>
    <div class="card" style="overflow-x:auto;">
      <table class="box">
        <thead><tr><th>Pitcher</th><th>IP</th><th>Pitches</th><th>H</th><th>R</th><th>ER</th><th>BB</th><th>K</th></tr></thead>
        <tbody>${pitchRows || `<tr><td colspan="8" class="empty-note">No pitching yet</td></tr>`}</tbody>
      </table>
    </div>`:''}
    `;
  }
  return `
  ${state.gameOver? renderGameOverBanner(false) : ''}
  <button class="btn clay block" onclick="exportCSV()">${t('btn_export_csv')}</button>
  ${teamBlock('us')}
  ${teamBlock('them')}
  <h2 class="section-title">${t('hdr_play_log')}</h2>
  <div class="log card">${state.log.map(l=>`<div>${l}</div>`).join('') || '<div class="empty-note">No plays yet</div>'}</div>
  `;
}

function renderScorebookGrid(){
  if(!state.gameStarted) return `<div class="empty-note">Start the game to see the scorebook fill in.</div>`;
  const key = state.scorebookTeam;
  const tm = team(key);
  const ids = battingRosterIds(key);
  const curKey = battingKey();
  const curBatter = state.gameOver? null : currentBatterId();
  const maxInnSeen = Math.max(state.inning, 1);

  // Build a shared column list: for each inning, one column per "time through" that
  // inning saw (extra columns only appear when the lineup actually looped back around).
  // Columns key off each entry's own `subIndex` (the shared lineup-SLOT loop count — see
  // nextSlotSubIndex) rather than its position in that player's personal box array, so a sub who
  // takes over a slot mid-loop lands in the correct existing column (e.g. "1'") instead of always
  // starting over at column 1. Older saved games predate the subIndex field — for those entries,
  // fall back to the array position, which is exactly how columns worked before this field existed.
  const entrySubIndex = (b, idx)=> (b.subIndex!==undefined ? b.subIndex : idx);
  const columns = [];
  for(let inn=1; inn<=maxInnSeen; inn++){
    let maxSub = 0;
    ids.forEach(pid=>{ getBoxes(key,pid,inn).forEach((b,idx)=>{ const si=entrySubIndex(b,idx); if(si>maxSub) maxSub=si; }); });
    for(let j=0;j<=maxSub;j++){
      columns.push({ inning: inn, subIndex: j, label: inn + (j>0 ? "'".repeat(j) : '') });
    }
  }
  // Make sure the batter now up always has a column to sit in, even if no one else
  // has reached that loop of the order yet this inning.
  if(!state.gameOver && key===curKey && curBatter){
    const curSub = currentSlotSubIndex(key);
    if(!columns.some(c=>c.inning===state.inning && c.subIndex===curSub)){
      columns.push({ inning: state.inning, subIndex: curSub, label: state.inning + (curSub>0 ? "'".repeat(curSub) : '') });
    }
  }
  columns.sort((a,b)=> a.inning-b.inning || a.subIndex-b.subIndex);

  const rows = ids.map(pid=>({ pid, isCurrent: !state.gameOver && key===curKey && pid===curBatter, subbedOut: tm.lineup.length>0 && !tm.lineup.includes(pid) }));

  return `
  <div class="card grid-print-hide" style="padding:11px 12px;">
    <div class="row">
      <button class="btn ghost small" onclick="printScorebook()">${t('btn_print_pdf')}</button>
      <button class="btn ghost small" onclick="exportScorebookImage()">${t('btn_export_img')}</button>
    </div>
  </div>
  <div class="teamtabs">
    <button class="${state.scorebookTeam==='us'?'active':''}" onclick="state.scorebookTeam='us';render()">${team('us').name}</button>
    <button class="${state.scorebookTeam==='them'?'active':''}" onclick="state.scorebookTeam='them';render()">${team('them').name}</button>
  </div>
  <div class="zoom-bar grid-print-hide">
    <button onclick="zoomScorebook(-1)">−</button>
    <div class="pct">${ZOOM_STEPS[state.scorebookZoom]}%</div>
    <button onclick="zoomScorebook(1)">+</button>
  </div>
  <div class="caption" style="margin-bottom:6px;">${t('sb_tap_hint')}</div>
  <div class="card" id="scorebookPrintArea" style="width:100%;">
    <div style="font-weight:800; font-size:13px; margin-bottom:8px;">${tm.name} — ${t('hdr_batting')}</div>
    <div class="grid-scroll">
      <div class="grid-inner" style="transform:scale(${ZOOM_STEPS[state.scorebookZoom]/100});">
      <table class="scorebook">
        <thead><tr><th class="name-col">Batter</th>${columns.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
        <tbody>
          ${rows.map(r=>{
            const pid = r.pid;
            const cells = columns.map(c=>{
              const boxes = getBoxes(key, pid, c.inning);
              const entry = boxes.find((b,idx)=>entrySubIndex(b,idx)===c.subIndex);
              if(entry){
                return `<td class="box-cell filled" onclick="openBoxDetail('${key}','${pid}',${c.inning})">${renderBoxPreview(entry, false)}</td>`;
              } else if(r.isCurrent && c.inning===state.inning && c.subIndex===currentSlotSubIndex(key)){
                return `<td class="box-cell current" onclick="openCurrentBoxQuick()">${renderBoxPreview(null, true)}</td>`;
              } else {
                return `<td class="box-cell"></td>`;
              }
            }).join('');
            const subNote = subNoteScorebook(key, pid);
            return `<tr>${r.subbedOut?'<td class="name-cell" style="opacity:0.55;">':'<td class="name-cell">'}${orderNameJersey(key,pid)}${subNote?` <span style="font-size:10px;color:#8C8570;">${subNote}</span>`:''}</td>${cells}</tr>`;
          }).join('') || `<tr><td colspan="${columns.length+1}" class="empty-note">No batters yet</td></tr>`}
        </tbody>
      </table>
      </div>
    </div>
  </div>
  <div class="card legend" style="font-size:11.5px; color:#5B5648;">
    <ul style="margin:0; padding-left:18px; line-height:1.55;">
      <li>${t('sb_legend_inning')}</li>
      <li>${t('sb_legend_hit_bases')}</li>
      <li>${t('sb_legend_count')}</li>
      <li>${t('sb_legend_out_num')}</li>
      <li>${t('sb_legend_path')}</li>
      <li>${t('sb_legend_sb')}</li>
      <li>${t('sb_legend_cs_po')}</li>
      <li>${t('sb_legend_batter_num')}</li>
      <li>${t('sb_legend_lob')}</li>
    </ul>
  </div>
  `;
}

function renderBoxPreview(entry, isCurrent){
  if(isCurrent && !entry){
    return `<div class="box-inner">
      <div style="position:absolute;top:22px;left:0;right:0;text-align:center;font-size:9px;font-weight:700;color:var(--field);">at bat</div>
    </div>`;
  }
  if(!entry) return `<div class="box-inner"></div>`;
  const centerLabel = entry.outPlay || entry.code || '';
  const hitBases = ['1B','2B','3B','HR','BB'].includes(entry.code) ? entry.code : null;
  return `
  <div class="box-inner">
    ${hitBases? `<div class="box-tl">${hitBases}</div>`:''}
    <div class="box-tr">${entry.balls}-${entry.strikes}</div>
    ${entry.outNumber? `<div class="box-br">${entry.outNumber}</div>`:''}
    ${entry.dp? `<div class="box-bl">DP</div>`:''}
    ${miniDiamond(entry.reached, centerLabel, entry.outAttemptTo, entry.legTags, entry.outAdvTag, entry.lob, entry.outBatterNum)}
  </div>`;
}

function diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum){
  const seg = (idx)=> (legTags && legTags[idx] && idx<=reached) ? '#D8D2C2' : (idx<=reached ? '#2D6A4F' : '#D8D2C2');
  const scored = reached>=4;
  const label = code && code.length>7 ? code.slice(0,7) : (code||'');
  const segCoords = {1:[30,52,52,30], 2:[52,30,30,8], 3:[30,8,8,30], 4:[8,30,30,52]};
  // Label positions pushed outward from the diamond center along each leg's outward normal, so
  // SB/WP/PB/CS/PO/FC sit beside the leg rather than overlapping it — and pulled back in toward center
  // (away from the batter-number circle further out on the same normal) to keep clear space between
  // the two: top legs (2 & 3) pushed further down, bottom legs (1 & 4) pulled further up.
  const labelPos = {1:[47.4,43], 2:[47.4,20], 3:[12.6,20], 4:[12.6,43]};
  // Pushed further out than labelPos, for the small circled at-bat-batter jersey number, so it doesn't
  // collide with an SB/WP/PB/FC label that might sit on the same leg.
  const batterLabelPos = {1:[52.5,52.5], 2:[52.5,7.5], 3:[7.5,7.5], 4:[7.5,52.5]};
  const dotAttr = 'stroke-dasharray="2.5 2.5" stroke-linecap="butt"';

  // Per-leg tags (SB / WP / PB from a steal or WP/PB advance, FC from a forced/fielder's-choice advance,
  // batterNum from the at-bat batter during that leg). These persist per leg independently of later legs,
  // so an SB tag on leg 2 survives a normal advance to leg 3.
  let legOverlays = '';
  if(legTags){
    Object.keys(legTags).forEach(legNumStr=>{
      const legNum = Number(legNumStr);
      if(legNum<1 || legNum>reached) return;
      const {label: tagLabel, dotted, batterNum} = legTags[legNum];
      const [x1,y1,x2,y2] = segCoords[legNum];
      // The base solid segment for this leg is skipped (see seg() above), so the overlay is the only
      // line drawn here — it can use the same green as a plain leg even when dotted, and the dots show
      // clearly against the plain background instead of disappearing into an identical-color solid line.
      legOverlays += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2D6A4F" stroke-width="${dotted?3:4}" ${dotted? dotAttr : 'stroke-linecap="square"'}></line>`;
      if(tagLabel){
        const [lx,ly] = labelPos[legNum];
        legOverlays += `<text x="${lx}" y="${ly}" font-size="6.5" font-weight="800" fill="#2D6A4F" stroke="#F7F4EC" stroke-width="2.2" paint-order="stroke" text-anchor="middle" font-family="ui-monospace,monospace">${tagLabel}</text>`;
      }
      if(batterNum){
        const [bx,by] = batterLabelPos[legNum];
        legOverlays += `<circle cx="${bx}" cy="${by}" r="6" fill="#F7F4EC" stroke="#2D6A4F" stroke-width="1.2"></circle>
          <text x="${bx}" y="${by+2.8}" font-size="8" font-weight="800" fill="#2D6A4F" text-anchor="middle" font-family="ui-monospace,monospace">${batterNum}</text>`;
      }
    });
  }

  // Out attempting the next base: amber highlight; dotted + CS/PO/WP/PB tag (outside the diamond) when
  // applicable, plus (for a batted-ball out) the same small circled at-bat-batter jersey number used on
  // legs the runner actually reached — this leg is never in legTags (reached stops short of it), so it's
  // drawn here instead. The circle itself stays the same green/style as every other batter-number circle
  // (it's identifying the batter, not the outcome) — only the attempt line and CS/PO/WP text stay amber.
  let attemptLine = '';
  if(attemptTo && attemptTo===reached+1 && attemptTo<=4){
    const [x1,y1,x2,y2] = segCoords[attemptTo];
    const mx = x1+(x2-x1)/2, my = y1+(y2-y1)/2;
    const isDotted = !!outAdvTag;
    attemptLine = `<line x1="${x1}" y1="${y1}" x2="${mx}" y2="${my}" stroke="#FFB800" stroke-width="4" stroke-linecap="round" ${isDotted?dotAttr:''}></line>`;
    if(isDotted){
      const [lx,ly] = labelPos[attemptTo];
      attemptLine += `<text x="${lx}" y="${ly}" font-size="6.5" font-weight="800" fill="#8a6100" stroke="#F7F4EC" stroke-width="2.2" paint-order="stroke" text-anchor="middle" font-family="ui-monospace,monospace">${outAdvTag}</text>`;
    }
    if(outBatterNum){
      const [bx,by] = batterLabelPos[attemptTo];
      attemptLine += `<circle cx="${bx}" cy="${by}" r="6" fill="#F7F4EC" stroke="#2D6A4F" stroke-width="1.2"></circle>
        <text x="${bx}" y="${by+2.8}" font-size="8" font-weight="800" fill="#2D6A4F" text-anchor="middle" font-family="ui-monospace,monospace">${outBatterNum}</text>`;
    }
  }
  return `
    ${scored? `<polygon points="30,52 52,30 30,8 8,30" fill="#FFB800" opacity="0.3"></polygon>`:''}
    <line x1="30" y1="52" x2="52" y2="30" stroke="${seg(1)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="52" y1="30" x2="30" y2="8"  stroke="${seg(2)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="30" y1="8"  x2="8"  y2="30" stroke="${seg(3)}" stroke-width="4" stroke-linecap="square"></line>
    <line x1="8"  y1="30" x2="30" y2="52" stroke="${seg(4)}" stroke-width="4" stroke-linecap="square"></line>
    ${legOverlays}
    ${attemptLine}
    ${lob
      ? `<text x="30" y="35" text-anchor="middle" font-size="11.3" font-weight="700" fill="#1C2621" font-family="Georgia,'Times New Roman',serif">&#8467;</text>`
      : (label? `<text x="30" y="33" text-anchor="middle" font-size="${(label==='K'||label==='Ks')?10:8.5}" font-weight="${(label==='K'||label==='Ks')?900:800}" fill="#1C2621" ${(label==='K'||label==='Ks')?'stroke="#1C2621" stroke-width="0.45" paint-order="stroke fill"':''} font-family="ui-monospace,monospace">${label}</text>`:'')}`;
}
function miniDiamond(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum){
  return `<svg width="45" height="45" viewBox="0 0 60 60" style="position:absolute; top:14px; left:50%; margin-left:-22.5px; width:45px; height:45px; display:block;">${diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum)}</svg>`;
}
function largeDiamond(reached, code, attemptTo, legTags, outAdvTag, size, lob, outBatterNum){
  size = size || 92;
  return `<svg width="${size}" height="${size}" viewBox="0 0 60 60" style="display:block; margin:0 auto;">${diamondSvgInner(reached, code, attemptTo, legTags, outAdvTag, lob, outBatterNum)}</svg>`;
}

function composeEditAnnotation(){
  const s = state.sheet;
  if(!s) return '';
  const seq = (s.editSeq||[]).join('-');
  let text;
  if(s.editPrefix==='none') text = seq;
  else if(s.editPrefix==='F') text = seq? 'F-'+seq : 'F';
  else if(s.editPrefix==='E') text = seq? 'E'+seq : 'E';
  else text = seq? `${s.editPrefix} ${seq}` : s.editPrefix;
  if(s.editDP) text = text? text+' DP' : 'DP';
  return text;
}
function applyEditAnnotation(){
  if(!state.sheet) return;
  const { teamKey, playerId, inning, editIndex } = state.sheet;
  const entry = getBoxes(teamKey, playerId, inning)[editIndex];
  const composed = composeEditAnnotation();
  if(entry){
    if(composed) entry.outPlay = composed;
    entry.dp = !!state.sheet.editDP; // drives the .box-bl "DP" badge in the grid
  }
  state.sheet.editIndex = null;
  render();
}

// Checks whether the runner-movement choices currently selected on a sheet would put more than one
// person on the same base (e.g. two runners both left on 2nd, or a runner staying where the batter is
// also headed). Works for both the plain hit sheet and the OUT_PLAY sheet, since both use the same
// stay/advance1/advance2/score/out runner-choice vocabulary — they only differ in how the batter's own
// destination is derived.
function computeBaseAssignments(s){
  const bases = {1:[],2:[],3:[]};
  if(s.outcome==='HR') return bases; // every existing runner scores, batter scores — no base collisions possible
  (s.runners||[]).forEach(r=>{
    const nm = `#${r.num} ${r.name}`;
    if(r.choice==='stay') bases[r.base].push(nm);
    else if(r.choice==='advance1'){ const nb=r.base+1; if(nb<=3) bases[nb].push(nm); }
    else if(r.choice==='advance2'){ const nb=r.base+2; if(nb<=3) bases[nb].push(nm); }
  });
  let battb = null;
  if(s.outcome==='OUT_PLAY'){ if(!s.batter.out) battb = 1; }
  else { const dest = batterDestBase(s.kind || s.outcome); if(typeof dest==='number') battb = dest; }
  if(battb) bases[battb].push('Batter');
  return bases;
}
function baseCollisionMessages(s){
  const bases = computeBaseAssignments(s);
  const labels = {1:'1st',2:'2nd',3:'3rd'};
  const msgs = [];
  [1,2,3].forEach(b=>{ if(bases[b].length>1) msgs.push(`${bases[b].join(' & ')} would both be on ${labels[b]}`); });
  return msgs;
}

function previewBasesForSheet(s){
  const key = battingKey();
  const bases = {1:null,2:null,3:null};
  const scored = [];
  if(s.outcome==='HR'){
    (s.runners||[]).forEach(r=>scored.push(r));
  } else {
    (s.runners||[]).slice().sort((a,b)=>b.base-a.base).forEach(r=>{
      if(r.choice==='stay') bases[r.base]=r;
      else if(r.choice==='advance1'){ const nb=r.base+1; if(nb<=3) bases[nb]=r; else scored.push(r); }
      else if(r.choice==='advance2'){ const nb=r.base+2; if(nb<=3) bases[nb]=r; else scored.push(r); }
      else if(r.choice==='score') scored.push(r);
    });
  }
  const dest = batterDestBase(s.kind || s.outcome);
  const batter = { id: currentBatterId(), name: playerName(key, currentBatterId()), num: playerNum(key, currentBatterId()) };
  if(s.outcome==='OUT_PLAY'){
    if(!s.batter.out) bases[1]=batter; // simplified model: a safe batter on these kinds always ends at 1st
  } else if(dest==='home') scored.push(batter); else if(dest) bases[dest]=batter;
  return {bases, scored};
}
function renderPreviewDiamond(s){
  const {bases, scored} = previewBasesForSheet(s);
  const key = battingKey();
  const lbl = (r)=> r? String(battingOrderNum(key, r.id)||'') : '';
  const activeSeq = activeSeqFor(s);
  // Interactive fielder-tap overlay reuses the same FIELD_FIELDERS coordinates and 10px-target sizing
  // as the shared marker style (fieldFielderMarker), but keeps its own active/inactive states — a
  // tapped fielder gets a bigger, amber circle plus an optional sequence-order badge above it.
  const fielderFs = fieldFielderFontSize(FIELD_RENDER_W_SM);
  const fielderOverlay = Object.keys(FIELD_FIELDERS).map(n=>{
    const f = FIELD_FIELDERS[n];
    const idx = activeSeq.indexOf(Number(n));
    const isActive = idx>=0;
    const r = fielderFs * (isActive ? 1.0 : 0.8);
    return `<circle cx="${f.x}" cy="${f.y}" r="${r}" fill="${isActive?'#FFB800':'rgba(255,255,255,0.75)'}" stroke="${isActive?'#8a6100':'#8C8570'}" stroke-width="${fielderFs*0.09}"></circle>
      <text x="${f.x}" y="${f.y+fielderFs*0.34}" text-anchor="middle" font-size="${fielderFs}" font-weight="800" fill="${isActive?'#1C2621':'#5B5648'}" font-family="ui-monospace,monospace">${n}</text>
      ${isActive && activeSeq.length>1 ? `<text x="${f.x}" y="${f.y-fielderFs}" text-anchor="middle" font-size="${fielderFs*0.7}" font-weight="900" fill="#8a6100" font-family="ui-monospace,monospace">${idx+1}</text>` : ''}`;
  }).join('');
  const chainLines = activeSeq.slice(0,-1).map((n,i)=>{
    const p1 = FIELD_FIELDERS[n], p2 = FIELD_FIELDERS[activeSeq[i+1]];
    return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="#FFB800" stroke-width="${fielderFs*0.12}" stroke-linecap="round" opacity="0.85"></line>`;
  }).join('');
  const runnerFs = fieldRunnerFontSize(FIELD_RENDER_W_SM);
  const runnerLabels = [1,2,3].map(n=>{
    const r = bases[n]; if(!r) return '';
    const p = fieldLabelPos(n);
    return `<text x="${p.x}" y="${p.y}" font-family="ui-monospace,monospace" font-size="${runnerFs}" font-weight="900" fill="#FFB800" stroke="#8a6100" stroke-width="${runnerFs*0.11}" paint-order="stroke fill" text-anchor="middle">${lbl(r)}</text>`;
  }).join('');
  return `
  <div class="diamond-wrap sm">
    <svg viewBox="${FIELD_VIEWBOX}">
      ${fieldBackgroundSVG()}
      ${fieldBaseRect(2, !!bases[2])}
      ${fieldBaseRect(1, !!bases[1])}
      ${fieldBaseRect(3, !!bases[3])}
      <g>${chainLines}${fielderOverlay}</g>
      ${runnerLabels}
    </svg>
  </div>
  <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:18px; margin:4px 0 2px;">
    ${activeSeq.length ? `<div style="text-align:center;font-size:10.5px;color:#8C8570;">showing fielders for: <b style="color:var(--field-2);">${s.activeSubject==='batter'?'Batter':'runner on '+({1:'1st',2:'2nd',3:'3rd'}[s.activeSubject])}</b></div>` : ''}
    ${scored.length? `<div class="scored-note" style="margin-top:0;">Scoring: ${scored.map(r=>orderNameJersey(key,r.id)).join(', ')}</div>` : ''}
  </div>
  `;
}

function renderSheet(){
  const s = state.sheet;
  if(!s) return '';
  if(s.outcome==='SCAN_CROP'){
    const hintParts = t('scan_crop_hint').split('|');
    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet tall">
      <h3>${t('scan_crop_title')}</h3>
      <div class="sub" style="font-size:11px;color:#8C8570;margin-bottom:2px;">${hintParts[0]}</div>
      <div class="sub" style="font-size:11px;color:#8C8570;margin-bottom:10px;">${hintParts[1]||''}</div>
      <div id="scanCropWrap" style="position:relative; touch-action:none; display:flex; justify-content:center;">
        <canvas id="scanCropCanvas" style="max-width:100%; max-height:42vh; width:auto; height:auto; border-radius:8px; border:1.5px solid var(--line); cursor:crosshair;"></canvas>
      </div>
      <div class="row" style="margin-top:10px;">
        <button class="btn ghost small" onclick="scanCropRotate90(-1)">⟲ ${t('btn_rotate_left')}</button>
        <button class="btn ghost small" onclick="scanCropRotate90(1)">⟳ ${t('btn_rotate_right')}</button>
      </div>
      <label style="margin-top:8px;">${t('lbl_fine_tilt')}: <span id="scanTiltVal">${s.tiltDeg||0}</span>°</label>
      <input type="range" min="-45" max="45" step="1" value="${s.tiltDeg||0}" style="width:100%;margin-bottom:6px;" oninput="scanCropTiltChange(this.value)">
      <div class="row" style="margin-top:4px;">
        <button class="btn ghost small" onclick="scanCropReset()">${t('btn_reset_crop')}</button>
        <button class="btn ghost small" onclick="scanCropApplyCrop()">${t('btn_apply_crop')}</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="btn ghost" onclick="scanCropCancel()">${t('btn_scan_retake')}</button>
        <button class="btn clay" onclick="scanCropConfirm()">${t('btn_continue_scan')}</button>
      </div>
    </div>`;
  }
  if(s.outcome==='SCAN_LOADING'){
    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <h3>${t('scan_loading_title')}</h3>
      <div class="sub">${t('scan_loading_sub')}</div>
      <div class="spinner"></div>
      <div class="loading-text">${t('scan_loading_note')}</div>
    </div>`;
  }
  if(s.outcome==='STRIKEOUT_TYPE'){
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Strikeout — looking or swinging?</h3>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn clay" onclick="chooseStrikeoutType('K')">Looking (K)</button>
        <button class="btn clay" onclick="chooseStrikeoutType('Ks')">Swinging (Ks)</button>
      </div>
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  if(s.outcome==='BOX_DETAIL'){
    const boxes = getBoxes(s.teamKey, s.playerId, s.inning);
    const baseLabel = (r)=> ['out','1st','2nd','3rd','scored'][r] || '—';
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>#${playerNum(s.teamKey,s.playerId)} ${playerName(s.teamKey,s.playerId)} — Inning ${s.inning}</h3>
      ${boxes.map((b,i)=>{
        const editing = s.editIndex===i;
        if(editing){
          const preview = composeEditAnnotation();
          return `
          <div class="sb-detail-row" style="flex-direction:column; align-items:stretch; gap:8px;">
            <div style="font-weight:700;">Plate appearance ${i+1} — editing</div>
            <div style="display:flex; gap:14px; align-items:center; justify-content:center;">
              <div style="text-align:center;">
                <div class="count-label">Balls</div>
                <div class="row" style="align-items:center; gap:6px; margin-top:4px;">
                  <button class="btn small ghost" onclick="editEntryCount('balls',-1)">−</button>
                  <div class="count-value">${b.balls}</div>
                  <button class="btn small ghost" onclick="editEntryCount('balls',1)">+</button>
                </div>
              </div>
              <div style="text-align:center;">
                <div class="count-label">Strikes</div>
                <div class="row" style="align-items:center; gap:6px; margin-top:4px;">
                  <button class="btn small ghost" onclick="editEntryCount('strikes',-1)">−</button>
                  <div class="count-value">${b.strikes}</div>
                  <button class="btn small ghost" onclick="editEntryCount('strikes',1)">+</button>
                </div>
              </div>
            </div>
            <label style="margin-bottom:2px;">Field play annotation</label>
            ${renderFielderRefDiagram()}
            <div class="opt-row">
              <button class="opt-btn ${s.editPrefix==='none'?'sel':''}" onclick="setEditPrefix('none')">Plain</button>
              <button class="opt-btn ${s.editPrefix==='F'?'sel':''}" onclick="setEditPrefix('F')">Fly (F-)</button>
              <button class="opt-btn ${s.editPrefix==='FC'?'sel':''}" onclick="setEditPrefix('FC')">FC</button>
              <button class="opt-btn ${s.editPrefix==='E'?'sel':''}" onclick="setEditPrefix('E')">E</button>
              <button class="opt-btn ${s.editPrefix==='SF'?'sel':''}" onclick="setEditPrefix('SF')">SF</button>
              <button class="opt-btn ${s.editPrefix==='SH'?'sel':''}" onclick="setEditPrefix('SH')">SH</button>
              <button class="opt-btn ${s.editPrefix==='CS'?'sel':''}" onclick="setEditPrefix('CS')">CS</button>
              <button class="opt-btn ${s.editPrefix==='PO'?'sel':''}" onclick="setEditPrefix('PO')">PO</button>
              <button class="opt-btn ${s.editDP?'sel':''}" onclick="toggleEditDP()">+ DP</button>
            </div>
            ${renderFielderTapRow(s.editSeq, 'tapEditFielder')}
            <div style="text-align:center; font-family:ui-monospace,monospace; font-weight:800; font-size:15px; color:var(--field); min-height:18px;">${preview || '(no fielders tapped)'}</div>
            <div class="row">
              <button class="btn ghost small" onclick="undoEditFielder()">↺ Undo Fielder</button>
              <button class="btn ghost small" onclick="cancelEditBoxEntry()">Cancel</button>
            </div>
            <button class="btn clay block" onclick="applyEditAnnotation()">Apply</button>
          </div>`;
        }
        const centerLabel = b.outPlay || b.code || '';
        return `
        <div class="sb-detail-row" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px;">
            <div style="flex:none;">${largeDiamond(b.reached, centerLabel, b.outAttemptTo, b.legTags, b.outAdvTag, 96, b.lob, b.outBatterNum)}</div>
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                <div style="font-weight:700;">Plate appearance ${i+1}: ${b.code}${b.outPlay && b.outPlay!==b.code? ` → ${b.outPlay}`:''}${b.dp? ' · DP':''}</div>
                <button class="btn small ghost" onclick="startEditBoxEntry(${i})">Edit</button>
              </div>
              <div style="font-size:12px; color:#8C8570;">
                Reached: ${baseLabel(b.reached)}${b.isOut? ` · Out #${b.outNumber}`:''} · count ${b.balls}-${b.strikes}${b.fouls? ` · ${b.fouls} foul${b.fouls>1?'s':''}`:''}
              </div>
            </div>
          </div>
        </div>
      `;
      }).join('') || '<div class="empty-note">No plate appearances recorded.</div>'}
      <div class="sub" style="font-size:11px; color:#8C8570; margin-top:8px;">Editing here only fixes the pitch count and annotation — it doesn't change the score, outs, or stats. For that, use Undo on the Live tab and re-enter the play.</div>
      <button class="btn ghost block" onclick="state.sheet=null;render()">Close</button>
    </div>`;
  }
  if(s.outcome==='RUNNER_EVENT'){
    const r = s.runners[0];
    if(s.mode==='choose_wp_pb'){
      return `
      <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
      <div class="sheet">
        <h3>#${r.num} ${r.name} — ${s.pendingAction==='advance'?'Advances':'Thrown out advancing'}</h3>
        <div class="sub" style="font-size:12px;color:#8C8570;margin-bottom:8px;">Was it a wild pitch or a passed ball?</div>
        <div class="row" style="margin-bottom:10px;">
          <button class="btn clay" onclick="selectWpPbType('WP')">Wild Pitch</button>
          <button class="btn clay" onclick="selectWpPbType('PB')">Passed Ball</button>
        </div>
        <button class="btn ghost block" onclick="backToRunnerMain()">← Back</button>
      </div>`;
    }
    if(s.mode==='out_entry'){
      const reasonLabel = s.outReason==='OOB' ? `Thrown Out Advancing (${s.wpType})` : {CS:'Caught Stealing', PO:'Picked Off'}[s.outReason];
      return `
      <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
      <div class="sheet">
        <h3>#${r.num} ${r.name} — ${reasonLabel}</h3>
        <div class="sub" style="font-size:12px;color:#8C8570;margin-bottom:8px;">Tap the fielders involved, in order (optional).</div>
        ${renderFielderRefDiagram()}
        ${renderFielderTapRow(s.fieldSeq, 'tapRunnerOutFielder')}
        <div style="text-align:center; font-family:ui-monospace,monospace; font-weight:800; font-size:16px; color:var(--field); min-height:20px; margin:6px 0;">${(s.fieldSeq||[]).join('-')}</div>
        <div class="row" style="margin:10px 0;">
          <button class="btn ghost small" onclick="undoRunnerOutFielder()">↺ Undo Fielder</button>
          <button class="btn ghost small" onclick="backToRunnerMain()">← Back</button>
        </div>
        <button class="btn clay block" onclick="confirmRunnerOut()">Confirm Out</button>
      </div>`;
    }
    const blocked = stealAdvanceBlocked(s.baseTapped);
    const blockedNote = blocked ? `<div class="result-banner warn" style="margin-bottom:12px;">Next base occupied — only outs possible</div>` : '';
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Runner: #${r.num} ${r.name}</h3>
      ${blockedNote}
      <div class="opt-row-2col">
        <button class="opt-btn adv-btn" ${blocked?'disabled':''} onclick="runnerAdvance('steal')">Steals next base</button>
        <button class="opt-btn adv-btn" ${blocked?'disabled':''} onclick="chooseWpPb('advance')">Advances (WP/PB)</button>
      </div>
      <div class="opt-row-2col">
        <button class="opt-btn out-btn" onclick="startRunnerOutEntry('CS')">Caught stealing</button>
        <button class="opt-btn out-btn" onclick="chooseWpPb('out')">Out advancing (WP/PB)</button>
      </div>
      <div class="opt-row-2col">
        <button class="opt-btn out-btn" onclick="startRunnerOutEntry('PO')">Picked off</button>
      </div>
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  if(s.outcome==='OUT_PLAY'){
    const kindLabel = {'GO':'Ground Out','FO':'Fly Out','PU':'Pop Out','SF':'Sac Fly','SAC':'Sac Bunt','E':'Error'}[s.kind] || s.kind;
    const finalKind = deriveOutPlayKind(s);
    const finalLabel = {'GO':'Ground Out','FO':'Fly Out','SF':'Sac Fly','SAC':'Sac Bunt','E':'Error','FC':"Fielder's Choice",'DP':'Double Play'}[finalKind] || finalKind;
    const batterLocked = BATTER_LOCKED_OUT.includes(s.kind) || BATTER_LOCKED_SAFE.includes(s.kind);
    const batterIdx = s.outOrder.indexOf('batter');
    const batterBadge = batterIdx>=0 ? `<div class="out-badge ${s.swapSelect==='batter'?'sel':''}" onclick="outPlayTapBadge('batter')">${batterIdx+1}</div>` : '';
    const collisions = baseCollisionMessages(s);
    const canConfirm = (s.outOrder.length>0 || s.kind==='E') && !collisions.length;

    const batterToggleHtml = batterLocked
      ? `<div class="pill" style="background:${s.batter.out?'var(--clay)':'var(--field-2)'};">${s.batter.out?'Out':'Safe'}</div>`
      : `<div class="opt-row">
          <button class="opt-btn ${!s.batter.out?'sel':''}" onclick="outPlaySetBatterOut(false)">Safe</button>
          <button class="opt-btn ${s.batter.out?'sel':''}" onclick="outPlaySetBatterOut(true)">Out</button>
        </div>`;

    const batterSection = `
      <div class="runner-row">
        <div class="rname" style="display:flex;justify-content:space-between;align-items:center;">
          <span>Batter</span>${batterBadge}
        </div>
        ${batterToggleHtml}
        ${s.batter.out ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:6px 0 4px;">Out at:</div>
        <div class="opt-row">
          <button class="opt-btn ${(s.batter.outAt||1)===1?'sel':''}" onclick="outPlaySetBatterOutAt(1)">1st</button>
          <button class="opt-btn ${s.batter.outAt===2?'sel':''}" onclick="outPlaySetBatterOutAt(2)">2nd</button>
          <button class="opt-btn ${s.batter.outAt===3?'sel':''}" onclick="outPlaySetBatterOutAt(3)">3rd</button>
          <button class="opt-btn ${s.batter.outAt===4?'sel':''}" onclick="outPlaySetBatterOutAt(4)">Home</button>
        </div>` : ''}
        ${(s.batter.out || s.kind==='E') ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:8px 0 4px;">${s.kind==='E' ? 'Fielder charged with the error:' : 'Fielders involved (optional):'}</div>
        <div class="fielded-row">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="outPlayTapBatterFielder(${n})">${n}</button>`).join('')}</div>
        <div style="text-align:center;font-family:ui-monospace,monospace;font-weight:800;font-size:14px;color:var(--field);min-height:18px;margin:4px 0;">${s.batter.seq.join('-')}</div>
        <button class="btn ghost small" onclick="outPlayUndoBatterFielder()" style="margin:2px auto 4px;display:block;">↺ Undo Fielder</button>
        ` : ''}
      </div>`;

    const runnerSections = s.runners.map(r=>{
      const idx = s.outOrder.indexOf(r.base);
      const badge = idx>=0 ? `<div class="out-badge ${s.swapSelect===r.base?'sel':''}" onclick="outPlayTapBadge(${r.base})">${idx+1}</div>` : '';
      return `
      <div class="runner-row">
        <div class="rname" style="display:flex;justify-content:space-between;align-items:center;">
          <span>#${r.num} ${r.name} (on ${r.base===1?'1st':r.base===2?'2nd':'3rd'})</span>${badge}
        </div>
        <div class="opt-row">
          <button class="opt-btn ${r.choice==='stay'?'sel':''}" onclick="sheetChoose(${r.base},'stay')">Stays</button>
          <button class="opt-btn ${r.choice==='advance1'?'sel':''}" onclick="sheetChoose(${r.base},'advance1')">+1 base</button>
          <button class="opt-btn ${r.choice==='advance2'?'sel':''}" onclick="sheetChoose(${r.base},'advance2')">+2 bases</button>
          <button class="opt-btn ${r.choice==='score'?'sel':''}" onclick="sheetChoose(${r.base},'score')">Scores</button>
          <button class="opt-btn ${r.choice==='out'?'sel':''}" onclick="sheetChoose(${r.base},'out')">Out</button>
        </div>
        ${r.choice==='out' ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:6px 0 4px;">Out trying for:</div>
        <div class="opt-row">${outTargetOptions(r.base).map(tb=>`<button class="opt-btn ${r.outTarget===tb.v?'sel':''}" onclick="sheetChoose(${r.base},'out',${tb.v})">${tb.label}</button>`).join('')}</div>
        <div class="sub" style="font-size:11px;color:#8C8570;margin:8px 0 4px;">Fielders involved (optional):</div>
        <div class="fielded-row">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="sheetOutFieldTap(${r.base},${n})">${n}</button>`).join('')}</div>
        <div style="text-align:center;font-family:ui-monospace,monospace;font-weight:800;font-size:14px;color:var(--field);min-height:18px;margin:4px 0;">${(r.outFieldSeq||[]).join('-')}</div>
        <button class="btn ghost small" onclick="sheetOutFieldUndo(${r.base})" style="margin:2px auto 4px;display:block;">↺ Undo Fielder</button>
        ` : ''}
      </div>`;
    }).join('');

    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <h3>${kindLabel}</h3>
      ${renderPreviewDiamond(s)}
      <div style="text-align:center;font-size:10px;color:#8a8373;margin:-4px 0 10px;">1 P · 2 C · 3 1B · 4 2B · 5 3B · 6 SS · 7 LF · 8 CF · 9 RF</div>
      ${canConfirm
        ? `<div class="result-banner ok">Recorded as: <b>${finalLabel}</b></div>`
        : (collisions.length
            ? `<div class="result-banner warn">${collisions.join('; ')} — fix before confirming.</div>`
            : `<div class="result-banner warn">Mark at least one out to continue — or close this and use a hit/error button instead.</div>`)}
      ${s.outOrder.length>=2 ? `<div style="text-align:center;font-size:11px;color:#8C8570;margin:4px 0 8px;white-space:nowrap;">Tap <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--clay);color:#fff;font-size:9px;font-weight:900;vertical-align:-2px;">×</span> to swap out sequence</div>` : ''}
      ${batterSection}
      ${runnerSections}
      <button class="btn block" ${!canConfirm?'disabled':''} onclick="confirmOutPlay()">Confirm</button>
    </div>`;
  }
  if(s.outcome==='SUB_PLAYER'){
    const tm = team(s.teamKey);
    const outId = tm.lineup[s.lineupIndex];
    const bench = tm.players.filter(p=>!tm.lineup.includes(p.id));
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Substitute for ${orderNameJersey(s.teamKey,outId)}</h3>
      ${bench.length ? bench.map(p=>`
        <div class="lineup-pick" onclick="confirmSub('${p.id}')">
          <span>${p.num.trim()!==''?'#'+p.num+' ':''}${p.name||'(no name)'}</span>
        </div>
      `).join('') : '<div class="empty-note">No eligible bench players — add one on the Roster tab first.</div>'}
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  if(s.outcome==='CHANGE_BATTER'){
    const t = team(s.teamKey);
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Set current batter — ${t.name}</h3>
      ${t.lineup.map((id,i)=>`
        <div class="lineup-pick ${i===t.battingIdx?'cur':''}" onclick="setBatter('${id}')">
          <span>${orderNameJersey(s.teamKey,id)}</span>
          ${i===t.battingIdx?'<span class="pill">At bat</span>':''}
        </div>
      `).join('')}
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  if(s.outcome==='SWITCH_PITCHER'){
    const tm = team(s.teamKey);
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Set current pitcher — ${tm.name}</h3>
      ${tm.lineup.map(id=>`
        <div class="lineup-pick ${id===tm.currentPitcherId?'cur':''}" onclick="confirmSwitchPitcher('${id}')">
          <span>${orderNameJersey(s.teamKey,id)}</span>
          ${id===tm.currentPitcherId?'<span class="pill">Pitching</span>':''}
        </div>
      `).join('')}
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  const label = {'1B':'Single','2B':'Double','3B':'Triple','GO':'Ground Out','FO':'Fly Out','FC':"Fielder's Choice",'E':'Error','SF':'Sac Fly','SAC':'Sac Bunt','DP':'Double Play'}[s.outcome] || s.outcome;
  const willBeFC = ['1B','2B','3B'].includes(s.outcome) && s.runners.some(r=>r.choice==='out');
  const collisions = baseCollisionMessages(s);
  return `
  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <h3>${label} — confirm runner movement</h3>
    ${renderPreviewDiamond(s)}
    <div style="text-align:center;font-size:10px;color:#8a8373;margin:-4px 0 10px;">1 P · 2 C · 3 1B · 4 2B · 5 3B · 6 SS · 7 LF · 8 CF · 9 RF</div>
    ${willBeFC ? `<div class="result-banner ok">A runner is out on this play — recorded as: <b>Fielder's Choice</b> (no hit credited)</div>` : ''}
    ${collisions.length ? `<div class="result-banner warn">${collisions.join('; ')} — fix before confirming.</div>` : ''}
    ${s.outOrder.length>=2 ? `<div style="text-align:center;font-size:11px;color:#8C8570;margin:4px 0 8px;white-space:nowrap;">Tap <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--clay);color:#fff;font-size:9px;font-weight:900;vertical-align:-2px;">×</span> to swap out sequence</div>` : ''}
    ${s.runners.map(r=>{
      const idx = s.outOrder.indexOf(r.base);
      const badge = idx>=0 ? `<div class="out-badge ${s.swapSelect===r.base?'sel':''}" onclick="outPlayTapBadge(${r.base})">${idx+1}</div>` : '';
      return `
      <div class="runner-row">
        <div class="rname" style="display:flex;justify-content:space-between;align-items:center;">
          <span>#${r.num} ${r.name} (on ${r.base===1?'1st':r.base===2?'2nd':'3rd'})</span>${badge}
        </div>
        <div class="opt-row">
          <button class="opt-btn ${r.choice==='stay'?'sel':''}" onclick="sheetChoose(${r.base},'stay')">Stays</button>
          <button class="opt-btn ${r.choice==='advance1'?'sel':''}" onclick="sheetChoose(${r.base},'advance1')">+1 base</button>
          <button class="opt-btn ${r.choice==='advance2'?'sel':''}" onclick="sheetChoose(${r.base},'advance2')">+2 bases</button>
          <button class="opt-btn ${r.choice==='score'?'sel':''}" onclick="sheetChoose(${r.base},'score')">Scores</button>
          <button class="opt-btn ${r.choice==='out'?'sel':''}" onclick="sheetChoose(${r.base},'out')">Out</button>
        </div>
        ${r.choice==='out' ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:6px 0 4px;">Out trying for:</div>
        <div class="opt-row">${outTargetOptions(r.base).map(tb=>`<button class="opt-btn ${r.outTarget===tb.v?'sel':''}" onclick="sheetChoose(${r.base},'out',${tb.v})">${tb.label}</button>`).join('')}</div>
        <div class="sub" style="font-size:11px;color:#8C8570;margin:8px 0 4px;">Fielders involved (optional):</div>
        <div class="fielded-row">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="sheetOutFieldTap(${r.base},${n})">${n}</button>`).join('')}<button class="dp-toggle ${r.outPrefix==='DP'?'sel':''}" onclick="sheetToggleRunnerPrefix(${r.base},'DP')">DP</button></div>
        <div style="text-align:center;font-family:ui-monospace,monospace;font-weight:800;font-size:14px;color:var(--field);min-height:18px;margin:4px 0;">${(r.outFieldSeq||[]).join('-')}</div>
        <button class="btn ghost small" onclick="sheetOutFieldUndo(${r.base})" style="margin:2px auto 4px;display:block;">↺ Undo Fielder</button>
        ` : ''}
      </div>
    `;}).join('')}
    <button class="btn block" ${collisions.length?'disabled':''} onclick="confirmSheet()">Confirm Play</button>
  </div>`;
}

restoreAutosaveIfAny();
render();
</script>
</body>
</html>
