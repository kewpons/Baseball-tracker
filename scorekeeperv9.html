      <div class="runner-row">
        <div class="rname" style="display:flex;justify-content:space-between;align-items:center;">
          <span>#${r.num} ${r.name} (on ${r.base===1?'1st':r.base===2?'2nd':'3rd'})</span>${badge}
        </div>
        <div class="opt-row">
          <button class="opt-btn ${r.choice==='stay'?'sel':''}" onclick="sheetChoose(${r.base},'stay')">Stays</button>
          <button class="opt-btn ${r.choice==='advance1'?'sel':''}" onclick="sheetChoose(${r.base},'advance1')">+1 base</button>
          <button class="opt-btn ${r.choice==='advance2'?'sel':''}" onclick="sheetChoose(${r.base},'advance2')">+2 bases</button>
          <button class="opt-btn ${r.choice==='score'?'sel':''}" onclick="sheetChoose(${r.base},'score')">Scores</button>
          <button class="opt-btn ${r.choice==='out'?'sel':''}" onclick="sheetChoose(${r.base},'out')">Out</button>
        </div>
        ${r.choice==='out' ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:6px 0 4px;">Out trying for:</div>
        <div class="opt-row">${outTargetOptions(r.base).map(tb=>`<button class="opt-btn ${r.outTarget===tb.v?'sel':''}" onclick="sheetChoose(${r.base},'out',${tb.v})">${tb.label}</button>`).join('')}</div>
        <div class="sub" style="font-size:11px;color:#8C8570;margin:8px 0 4px;">Fielders involved (optional):</div>
        <div class="fielded-row">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="sheetOutFieldTap(${r.base},${n})">${n}</button>`).join('')}</div>
        <div style="text-align:center;font-family:ui-monospace,monospace;font-weight:800;font-size:14px;color:var(--field);min-height:18px;margin:4px 0;">${(r.outFieldSeq||[]).join('-')}</div>
        <button class="btn ghost small" onclick="sheetOutFieldUndo(${r.base})" style="margin:2px auto 4px;display:block;">↺ Undo Fielder</button>
        ` : ''}
      </div>`;
    }).join('');

    return `
    <div class="sheet-backdrop"></div>
    <div class="sheet">
      <h3>${kindLabel}</h3>
      ${renderPreviewDiamond(s)}
      <div style="text-align:center;font-size:10px;color:#8a8373;margin:-4px 0 10px;">1 P · 2 C · 3 1B · 4 2B · 5 3B · 6 SS · 7 LF · 8 CF · 9 RF</div>
      ${canConfirm
        ? `<div class="result-banner ok">Recorded as: <b>${finalLabel}</b></div>`
        : (collisions.length
            ? `<div class="result-banner warn">${collisions.join('; ')} — fix before confirming.</div>`
            : `<div class="result-banner warn">Mark at least one out to continue — or close this and use a hit/error button instead.</div>`)}
      ${s.outOrder.length>=2 ? `<div style="text-align:center;font-size:11px;color:#8C8570;margin:4px 0 8px;white-space:nowrap;">Tap <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--clay);color:#fff;font-size:9px;font-weight:900;vertical-align:-2px;">×</span> to swap out sequence</div>` : ''}
      ${batterSection}
      ${runnerSections}
      <button class="btn block" ${!canConfirm?'disabled':''} onclick="confirmOutPlay()">Confirm</button>
    </div>`;
  }
  if(s.outcome==='CHANGE_BATTER'){
    const t = team(s.teamKey);
    return `
    <div class="sheet-backdrop" onclick="state.sheet=null;render()"></div>
    <div class="sheet">
      <h3>Set current batter — ${t.name}</h3>
      ${t.lineup.map((id,i)=>`
        <div class="lineup-pick ${i===t.battingIdx?'cur':''}" onclick="setBatter('${id}')">
          <span>#${playerNum(s.teamKey,id)} ${playerName(s.teamKey,id)}</span>
          ${i===t.battingIdx?'<span class="pill">At bat</span>':''}
        </div>
      `).join('')}
      <button class="btn ghost block" onclick="state.sheet=null;render()">Cancel</button>
    </div>`;
  }
  const label = {'1B':'Single','2B':'Double','3B':'Triple','GO':'Ground Out','FO':'Fly Out','FC':"Fielder's Choice",'E':'Error','SF':'Sac Fly','SAC':'Sac Bunt','DP':'Double Play'}[s.outcome] || s.outcome;
  const willBeFC = ['1B','2B','3B'].includes(s.outcome) && s.runners.some(r=>r.choice==='out');
  const collisions = baseCollisionMessages(s);
  return `
  <div class="sheet-backdrop"></div>
  <div class="sheet">
    <h3>${label} — confirm runner movement</h3>
    ${renderPreviewDiamond(s)}
    <div style="text-align:center;font-size:10px;color:#8a8373;margin:-4px 0 10px;">1 P · 2 C · 3 1B · 4 2B · 5 3B · 6 SS · 7 LF · 8 CF · 9 RF</div>
    ${willBeFC ? `<div class="result-banner ok">A runner is out on this play — recorded as: <b>Fielder's Choice</b> (no hit credited)</div>` : ''}
    ${collisions.length ? `<div class="result-banner warn">${collisions.join('; ')} — fix before confirming.</div>` : ''}
    ${s.outOrder.length>=2 ? `<div style="text-align:center;font-size:11px;color:#8C8570;margin:4px 0 8px;white-space:nowrap;">Tap <span style="display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:var(--clay);color:#fff;font-size:9px;font-weight:900;vertical-align:-2px;">×</span> to swap out sequence</div>` : ''}
    ${s.runners.map(r=>{
      const idx = s.outOrder.indexOf(r.base);
      const badge = idx>=0 ? `<div class="out-badge ${s.swapSelect===r.base?'sel':''}" onclick="outPlayTapBadge(${r.base})">${idx+1}</div>` : '';
      return `
      <div class="runner-row">
        <div class="rname" style="display:flex;justify-content:space-between;align-items:center;">
          <span>#${r.num} ${r.name} (on ${r.base===1?'1st':r.base===2?'2nd':'3rd'})</span>${badge}
        </div>
        <div class="opt-row">
          <button class="opt-btn ${r.choice==='stay'?'sel':''}" onclick="sheetChoose(${r.base},'stay')">Stays</button>
          <button class="opt-btn ${r.choice==='advance1'?'sel':''}" onclick="sheetChoose(${r.base},'advance1')">+1 base</button>
          <button class="opt-btn ${r.choice==='advance2'?'sel':''}" onclick="sheetChoose(${r.base},'advance2')">+2 bases</button>
          <button class="opt-btn ${r.choice==='score'?'sel':''}" onclick="sheetChoose(${r.base},'score')">Scores</button>
          <button class="opt-btn ${r.choice==='out'?'sel':''}" onclick="sheetChoose(${r.base},'out')">Out</button>
        </div>
        ${r.choice==='out' ? `
        <div class="sub" style="font-size:11px;color:#8C8570;margin:6px 0 4px;">Out trying for:</div>
        <div class="opt-row">${outTargetOptions(r.base).map(tb=>`<button class="opt-btn ${r.outTarget===tb.v?'sel':''}" onclick="sheetChoose(${r.base},'out',${tb.v})">${tb.label}</button>`).join('')}</div>
        <div class="sub" style="font-size:11px;color:#8C8570;margin:8px 0 4px;">Fielders involved (optional):</div>
        <div class="fielded-row">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="sheetOutFieldTap(${r.base},${n})">${n}</button>`).join('')}<button class="dp-toggle ${r.outPrefix==='DP'?'sel':''}" onclick="sheetToggleRunnerPrefix(${r.base},'DP')">DP</button></div>
        <div style="text-align:center;font-family:ui-monospace,monospace;font-weight:800;font-size:14px;color:var(--field);min-height:18px;margin:4px 0;">${(r.outFieldSeq||[]).join('-')}</div>
        <button class="btn ghost small" onclick="sheetOutFieldUndo(${r.base})" style="margin:2px auto 4px;display:block;">↺ Undo Fielder</button>
        ` : ''}
      </div>
    `;}).join('')}
    <button class="btn block" ${collisions.length?'disabled':''} onclick="confirmSheet()">Confirm Play</button>
  </div>`;
}

render();
</script>
</body>
</html>
